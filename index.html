        const SUPABASE_URL = "https://mkizhwumwxfqlwwfoief.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_XL_p7DDfizVqdz_mETXztw_7MecHfiQ";

        window.popoutBroadcastChannel = new BroadcastChannel('snapcall_poker_channel_v16');

        window.defaultTourTemplate = function(name, id, buyIn, rebuyPrice) {
            return {
                id: id || 101,

                    isFinished: false
                }
            };
        };

        window.initCloudSync = async function(onDataReceived, onSyncStatusChange) {
            if (!SUPABASE_URL || !SUPABASE_ANON_KEY || !window.supabase) {
                console.warn("Supabase SDK chưa sẵn sàng.");
                onSyncStatusChange(false);
                return;
            }

            try {
                const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                onSyncStatusChange(true);

                const fetchCloudData = async () => {
                    try {
                        const { data, error } = await supabaseClient
                            .from('tournaments')
                            .select('data')
                            .eq('id', 'live_state')
                            .maybeSingle();

                        if (data && data.data && data.data.tours && Array.isArray(data.data.tours) && data.data.tours.length > 0) {
                            onDataReceived(data.data, true);
                        } else {
                            const initialDefaultState = {
                                tours: [
                                    window.defaultTourTemplate('MONTER STACK', 101, 100, 100)
                                ],
                                presets: [],
                                selectedTourId: 101,
                                lastUpdated: Date.now()
                            };
                            await supabaseClient.from('tournaments').upsert({ id: 'live_state', data: initialDefaultState, updated_at: new Date().toISOString() });
                            onDataReceived(initialDefaultState, true);
                        }
                    } catch(e) {
                        console.warn("Fetch Error:", e);
                    }
                };
                
                await fetchCloudData();

                const channel = supabaseClient
                    .channel('room_poker_live_v16', { config: { broadcast: { self: true } } })
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'tournaments' }, payload => {
                        if (payload.new && payload.new.data) {
                            onDataReceived(payload.new.data, true);
                        }
                    })
                    .on('broadcast', { event: 'tour_update' }, payload => {
                        if (payload.payload && payload.payload.data) {
                            onDataReceived(payload.payload.data, true);
                        }
                    })
                    .subscribe();

                window.saveTournamentsToCloud = async (appDataState) => {
                    window.popoutBroadcastChannel.postMessage({ data: appDataState });

                    try {
                        const payloadData = {
                            ...appDataState,
                            lastUpdated: Date.now()
                        };

                        channel.send({
                            type: 'broadcast',
                            event: 'tour_update',
                            payload: { data: payloadData }
                        });

                        await supabaseClient
                            .from('tournaments')
                            .upsert({ id: 'live_state', data: payloadData, updated_at: new Date().toISOString() });
                    } catch (e) {
                        console.warn("Lỗi lưu Supabase Cloud:", e);
                    }
                };
            } catch (err) {
                console.warn("Lỗi kết nối Supabase:", err);
                onSyncStatusChange(false);
            }
        };
    </script>

const getTodayDateString = () => {
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
};

function TournamentTVCard({ tour, openSinglePopout, isPopoutWindow }) {
    if (!tour) return <div className="text-white text-center p-10">Đang tải thông tin Tour...</div>;
    const currentStep = tour.blinds[tour.gameStats.currentStepIdx] || tour.blinds[0];

    const getCalculatedLevelNumber = (blindsList, stepIndex) => {
        let levelNum = 0;
        for (let i = 0; i <= stepIndex && i < blindsList.length; i++) {
            if (blindsList[i].type === 'level') levelNum++;
        }
        return levelNum;
    };

    const getSecondsToNextBreak = (t) => {
        let totalSecs = t.gameStats.secondsLeft;
        for (let i = t.gameStats.currentStepIdx + 1; i < t.blinds.length; i++) {
            if (t.blinds[i].type === 'break') break;
            totalSecs += t.blinds[i].length * 60;
        }
        return totalSecs;
    };

    const getNextLevelInfo = (t) => {
        for (let i = t.gameStats.currentStepIdx + 1; i < t.blinds.length; i++) {
            if (t.blinds[i].type === 'level') {
                return `${t.blinds[i].sb.toLocaleString()}/${t.blinds[i].bb.toLocaleString()}`;
            } else if (t.blinds[i].type === 'break') {
                return 'Break Time';
            }
        }
        return 'MAX LEVEL REACHED';
    };

    const formatTime = (totalSeconds) => {
        const mins = Math.floor(Math.max(0, totalSeconds) / 60);
        const secs = Math.floor(Math.max(0, totalSeconds) % 60);
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    };

    const formatTimeHHMMSS = (totalSeconds) => {
        const hrs = Math.floor(totalSeconds / 3600);
        const mins = Math.floor((totalSeconds % 3600) / 60);
        const secs = Math.floor(totalSeconds % 60);
        return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    };

    const currentLevelNum = getCalculatedLevelNumber(tour.blinds, tour.gameStats.currentStepIdx);
    const totalEntries = tour.gameStats.buyIns + tour.gameStats.rebuys;
    const totalPointsFromPayouts = tour.payouts.reduce((sum, p) => sum + (Number(p.value) || 0), 0);
    const totalChipsInPlay = totalEntries * tour.config.startingStack;
    const playersLeft = Math.max(0, tour.gameStats.buyIns - tour.gameStats.eliminated);
    const avgStack = playersLeft > 0 ? Math.round(totalChipsInPlay / playersLeft) : 0;
    const nextBreakTime = formatTimeHHMMSS(getSecondsToNextBreak(tour));
    
    const fontSizes = tour.config.fontCustomSizes || { brandPx: 30, headerPx: 56, subHeaderPx: 18, timerPx: 120, blindsPx: 54, nextLevelPx: 46, statsPx: 30, payoutsPx: 24, levelBadgePx: 22, infoRowPx: 16 };
    const themeStyle = getThemeStyles(tour.config.colorTheme);
    const selectedFontClass = tour.config.selectedFont || 'font-montserrat';
    const logoSize = tour.config.logoSizePx || 80;
    const qrSize = tour.config.qrSizePx || 70;

    return (
        <div 
            className={`w-full gold-border-box rounded-3xl bg-black/85 backdrop-blur-md p-4 sm:p-5 md:p-6 relative overflow-hidden shadow-2xl flex flex-col justify-between ${selectedFontClass} ${isPopoutWindow ? 'h-full min-h-screen' : 'min-h-[80vh]'} my-auto`}
            style={{
                backgroundImage: tour.config.bgImageUrl ? `url(${tour.config.bgImageUrl})` : 'none',
                backgroundSize: 'cover',
                backgroundPosition: 'center'
            }}
        >
            {openSinglePopout && (
                <button 
                    onClick={() => openSinglePopout(tour.id)}
                    className="absolute top-3 right-3 z-30 bg-sky-700/80 hover:bg-sky-600 text-white font-bold px-2.5 py-1 rounded-lg border border-sky-400/50 text-xs shadow transition flex items-center gap-1 cursor-pointer"
                    title="Mở riêng giải đấu này ra cửa sổ TV mới"
                >
                    <i className="fa-solid fa-up-right-from-square"></i> Popout TV
                </button>
            )}

            {tour.config.logoUrl && (
                <div className="absolute top-3 left-3 z-20">
                    <img src={tour.config.logoUrl} alt="Club Logo" style={{ height: `${logoSize}px` }} className="object-contain drop-shadow-md" />
                </div>
            )}

            <div className="flex flex-col md:grid md:grid-cols-12 gap-4 md:gap-2 items-center flex-1 w-full my-auto">
                <div className="w-full md:col-span-6 md:order-2 text-center space-y-1.5 sm:space-y-2 my-auto px-1">
                    <div className="text-center mb-1">
                        {(tour.config.showClubName !== false || tour.config.showSubTitle !== false) && (
                            <div className="flex flex-col items-center mb-1">
                                {tour.config.showClubName !== false && (
                                    <div className="text-gold font-extrabold tracking-[0.2em] font-cinzel text-center" style={{ fontSize: `${fontSizes.brandPx || 30}px` }}>
                                        {tour.config.clubName}
                                    </div>
                                )}
                                {tour.config.showSubTitle !== false && (
                                    <div className="text-[9px] text-gold/70 tracking-[0.25em] font-semibold uppercase border-t border-b border-gold/30 px-2 py-0.5 mt-0.5">
                                        — {tour.config.subTitle || 'BOARD GAME & COFFEE'} —
                                    </div>
                                )}
                            </div>
                        )}

                        <div className="font-black uppercase tracking-wider mb-1 font-cinzel text-center leading-tight" style={{ fontSize: `${fontSizes.headerPx || 56}px`, color: themeStyle.headerColor }}>
                            {tour.config.name}
                        </div>
                        
                        <div className="flex flex-wrap justify-center items-center gap-x-2 sm:gap-x-4 text-gray-200 font-medium tracking-wide" style={{ fontSize: `${fontSizes.infoRowPx || 16}px` }}>
                            <div>Buyin: <span className="text-white font-bold">{tour.config.buyIn}</span></div>
                            <div>Rebuy: <span className="text-white font-bold">{tour.config.rebuyPrice}</span></div>
                            <div>Stack: <span className="text-white font-bold">{tour.config.startingStack.toLocaleString()}</span></div>
                            <div>Reg End: <span className="text-white font-bold">Level {tour.config.regEndLevel}</span></div>
                        </div>
                    </div>

                    <div className="inline-block border border-gold/40 rounded-xl px-3 sm:px-5 py-0.5 bg-black/50 max-w-full">
                        <span className="font-bold text-gray-200 tracking-widest uppercase block text-center" style={{ fontSize: `${fontSizes.levelBadgePx || 22}px` }}>
                            {tour.gameStats.isFinished 
                                ? '🏆 TOUR FINISHED' 
                                : (currentStep.type === 'break' 
                                    ? `BREAK TIME ${currentStep.title ? `(${currentStep.title})` : ''} ${currentStep.isChipRace ? '- CHIP RACE' : ''}` 
                                    : `LEVEL ${currentLevelNum}`)}
                        </span>
                    </div>

                    <div className="py-1 flex justify-center items-center">
                        {tour.gameStats.isFinished ? (
                            <div className="font-timer font-black tracking-wider leading-none text-emerald-400 drop-shadow-lg" style={{ fontSize: `${fontSizes.timerPx || 120}px` }}>
                                FINISHED

                        ) : tour.gameStats.isPaused ? (
                            <div className="font-timer font-black tracking-wider leading-none text-red-500 animate-pause-pulse drop-shadow-lg" style={{ fontSize: `${fontSizes.timerPx || 120}px` }}>
                                PAUSED
                            </div>
                        ) : (

                                {formatTime(tour.gameStats.secondsLeft)}
                            </div>
                        )}
                    </div>

                    <div className="font-bold tracking-wider" style={{ fontSize: `${fontSizes.blindsPx || 54}px`, color: themeStyle.blindsColor }}>
                        {tour.gameStats.isFinished ? 'CẢM ƠN QUÝ HỘI VIÊN ĐÃ THAM GIA' : (currentStep.type === 'break' ? (currentStep.isChipRace ? `CHIP RACE: ${currentStep.chipRaceTitle || 'REMOVE LOW CHIPS'}` : 'BREAK TIME') : `BLINDS : ${currentStep.sb.toLocaleString()} / ${currentStep.bb.toLocaleString()}`)}
                    </div>

                    <div className="font-bold tracking-wider" style={{ fontSize: `${Math.max(14, (fontSizes.blindsPx || 54) - 10)}px`, color: themeStyle.blindsColor }}>
                        {tour.gameStats.isFinished ? 'HẸN GẶP LẠI Ở GIẢI ĐẤU TIẾP THEO' : (currentStep.type === 'break' ? (currentStep.isChipRace && currentStep.chipRaceTitle ? `RACE CHIP: ${currentStep.chipRaceTitle}` : '') : `ANTE : ${currentStep.ante.toLocaleString()}`)}
                    </div>

                    <div className="w-full max-w-xs mx-auto border-b border-gold/30 my-1"></div>

                    <div className="text-gray-300 font-medium" style={{ fontSize: `${fontSizes.nextLevelPx || 46}px` }}>
                        Next: <span className="text-white font-semibold">{tour.gameStats.isFinished ? 'END GAME' : getNextLevelInfo(tour)}</span>
                    </div>
                </div>

                <div className="w-full md:col-span-3 md:order-1 grid grid-cols-2 sm:grid-cols-3 md:flex md:flex-col gap-2 md:gap-3 text-left border-t md:border-t-0 md:border-l border-gold/20 pt-3 md:pt-0 md:pl-3">
                    <div>
                        <div className="text-gray-400 font-bold tracking-wider uppercase mb-0.5" style={{ fontSize: `${Math.max(9, (fontSizes.statsPx || 30) - 10)}px` }}>PLAYERS</div>
                        <div className="text-white font-black" style={{ fontSize: `${fontSizes.statsPx || 30}px` }}>{playersLeft} / {tour.gameStats.buyIns}</div>
                    </div>

                    <div>
                        <div className="text-gray-400 font-bold tracking-wider uppercase mb-0.5" style={{ fontSize: `${Math.max(9, (fontSizes.statsPx || 30) - 10)}px` }}>RE-BUY</div>
                        <div className="text-white font-black" style={{ fontSize: `${fontSizes.statsPx || 30}px` }}>{tour.gameStats.rebuys}</div>
                    </div>

                    <div>
                        <div className="text-gray-400 font-bold tracking-wider uppercase mb-0.5" style={{ fontSize: `${Math.max(9, (fontSizes.statsPx || 30) - 10)}px` }}>TOTAL ENTRIES</div>
                        <div className="text-white font-black" style={{ fontSize: `${fontSizes.statsPx || 30}px` }}>{totalEntries}</div>
                    </div>

                    <div>
                        <div className="text-gray-400 font-bold tracking-wider uppercase mb-0.5" style={{ fontSize: `${Math.max(9, (fontSizes.statsPx || 30) - 10)}px` }}>TOTAL STACK</div>
                        <div className="text-white font-black" style={{ fontSize: `${fontSizes.statsPx || 30}px` }}>{totalChipsInPlay.toLocaleString()}</div>
                    </div>

                    <div>
                        <div className="text-gray-400 font-bold tracking-wider uppercase mb-0.5" style={{ fontSize: `${Math.max(9, (fontSizes.statsPx || 30) - 10)}px` }}>AVG STACK</div>
                        <div className="text-white font-black" style={{ fontSize: `${fontSizes.statsPx || 30}px` }}>{avgStack.toLocaleString()}</div>
                    </div>

                    <div className="md:pt-1.5 md:border-t border-gray-800">
                        <div className="text-gray-400 font-bold tracking-wider uppercase mb-0.5" style={{ fontSize: `${Math.max(9, (fontSizes.statsPx || 30) - 10)}px` }}>NEXT BREAK</div>
                        <div className="text-white font-black" style={{ fontSize: `${fontSizes.statsPx || 30}px` }}>{nextBreakTime}</div>
                    </div>
                </div>

                            ))}

                    {tour.config.qrCodeUrl && (

                                <div className="text-[8px] text-gray-400">Đăng ký & thông tin</div>
                            </div>
                            <img src={tour.config.qrCodeUrl} alt="QR Code" style={{ height: `${qrSize}px`, width: `${qrSize}px` }} className="object-contain rounded border border-gold/40 p-0.5 bg-black/60" />
                        </div>
                    )}
                </div>
            </div>

            <div className="mt-3 pt-2 border-t border-gray-800/80 flex justify-between items-center text-[10px] text-gray-500 font-medium">
                <div>SNAP CALL • BOARD GAME & COFFEE • EST. 2026</div>
                <div>Powered by Snap Call</div>
            </div>
        </div>
    );
}

function App() {
    const [activeView, setActiveView] = useState('combined-dashboard');
    const [wizardStep, setWizardStep] = useState(1);
    const [isCloudSynced, setIsCloudSynced] = useState(false);
    const [draggedBlindIdx, setDraggedBlindIdx] = useState(null);
    const [searchPhoneInput, setSearchPhoneInput] = useState('');
    const [searchResultPlayer, setSearchResultPlayer] = useState(null);
    const [showFontSizesCollapse, setShowFontSizesCollapse] = useState(false);
    
    const [preTourCountdownSecs, setPreTourCountdownSecs] = useState(0);

    const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(() => {
        return localStorage.getItem('snapcall_admin_auth') === 'true';
    });
    const [showLoginModal, setShowLoginModal] = useState(false);
    const [targetProtectedView, setTargetProtectedView] = useState('admin');
    const [idInput, setIdInput] = useState('');
    const [pinInput, setPinInput] = useState('');
    const [loginError, setLoginError] = useState('');

    const isRemoteUpdatingRef = useRef(false);

    const [appState, setAppState] = useState(() => {
        return {
            tours: [window.defaultTourTemplate('MONTER STACK', 101, 100, 100)],
            presets: [],
            selectedTourId: 101
        };
    });

    const tournaments = appState.tours || [];
    const presets = appState.presets || [];
    const selectedTourId = appState.selectedTourId || tournaments[0]?.id || 101;

    const activeTour = tournaments.find(t => t.id === selectedTourId) || tournaments[0] || window.defaultTourTemplate('MONTER STACK', 101, 100, 100);

    const [draftConfigState, setDraftConfigState] = useState(() => JSON.parse(JSON.stringify(activeTour)));

    useEffect(() => {
        setDraftConfigState(JSON.parse(JSON.stringify(activeTour)));
    }, [selectedTourId, activeTour]);

    useEffect(() => {
        const calcRemaining = () => {
            const startDateStr = activeTour.config.scheduledStartDate || getTodayDateString();
            const startTimeStr = activeTour.config.scheduledStartTime || '13:00';
            const [yyyy, mm, dd] = startDateStr.split('-').map(Number);
            const [hrs, mins] = startTimeStr.split(':').map(Number);
            const targetDate = new Date(yyyy, mm - 1, dd, hrs, mins, 0);
            return Math.floor((targetDate.getTime() - Date.now()) / 1000);
        };

        setPreTourCountdownSecs(calcRemaining());
        const interval = setInterval(() => setPreTourCountdownSecs(calcRemaining()), 1000);
        return () => clearInterval(interval);
    }, [activeTour.config.scheduledStartDate, activeTour.config.scheduledStartTime]);

    const setSelectedTourId = (newTourId) => {
        setAppState(prev => {
            const nextState = { ...prev, selectedTourId: newTourId };
            if (window.saveTournamentsToCloud) {
                window.saveTournamentsToCloud(nextState);
            }
            return nextState;
        });
    };

    useEffect(() => {
        if (window.initCloudSync) {
            window.initCloudSync(
                (cloudState) => {
                    if (cloudState && cloudState.tours) {
                        isRemoteUpdatingRef.current = true;
                        setAppState(prev => {
                            const tourExists = cloudState.tours.some(t => t.id === prev.selectedTourId);
                            const validTourId = tourExists ? prev.selectedTourId : (cloudState.tours[0]?.id || 101);
                            return {
                                ...cloudState,
                                selectedTourId: validTourId
                            };
                        });
                        setTimeout(() => { isRemoteUpdatingRef.current = false; }, 300);
                    }
                },
                (status) => setIsCloudSynced(status)
            );
        }
    }, []);

    const applyDraftChangesToLive = () => {
        setAppState(prev => {
            const nextState = {
                ...prev,
                tours: prev.tours.map(t => t.id === selectedTourId ? JSON.parse(JSON.stringify(draftConfigState)) : t)
            };
            if (window.saveTournamentsToCloud) {
                window.saveTournamentsToCloud(nextState);
            }
            return nextState;
        });
        alert(`Đã CẬP NHẬT thành công cài đặt cho Tour "${draftConfigState.config.name}"!`);
    };

    const handleLoginSubmit = (e) => {
        e.preventDefault();
        if (idInput.trim() === 'Admin' && pinInput === '123456') {
            setIsAdminLoggedIn(true);
            localStorage.setItem('snapcall_admin_auth', 'true');
            setShowLoginModal(false);
            setIdInput('');
            setPinInput('');
            setLoginError('');
            setActiveView(targetProtectedView);
        } else {
            setLoginError('ID hoặc Mật khẩu không chính xác!');
        }
    };

    const handleLogout = () => {
        setIsAdminLoggedIn(false);
        localStorage.removeItem('snapcall_admin_auth');
        setActiveView('combined-dashboard');
    };

    const navigateToProtectedView = (viewName) => {
        if (isAdminLoggedIn) {
            setActiveView(viewName);
        } else {
            setTargetProtectedView(viewName);
            setShowLoginModal(true);
        }
    };

    const playSoundEffect = (soundType) => {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (soundType === 'Boxing Bell') {
                [0, 150].forEach(delay => {
                    setTimeout(() => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(1200, ctx.currentTime);
                        gain.gain.setValueAtTime(0.5, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.8);
                    }, delay);
                });
            } else if (soundType === 'Chime Bell') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.4, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 1.2);
            } else if (soundType === 'Digital Beep') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(1500, ctx.currentTime);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.25);
            } else if (soundType === 'Whistle') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(2400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(2800, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.4, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            }
        } catch (e) {
            console.log("Audio play error:", e);
        }
    };

    useEffect(() => {
        const timer = setInterval(() => {
            if (isRemoteUpdatingRef.current) return;
            const now = Date.now();
            setAppState(prevState => {
                let changed = false;
                const newTours = prevState.tours.map(tour => {
                    if (tour.gameStats.isPaused || tour.gameStats.isFinished || !tour.gameStats.targetEndTime) {
                        return tour;
                    }

                    const remainingSecs = Math.max(0, Math.ceil((tour.gameStats.targetEndTime - now) / 1000));

                    if (remainingSecs > 0) {
                        if (remainingSecs !== tour.gameStats.secondsLeft) {
                            changed = true;
                            return {
                                ...tour,
                                gameStats: { ...tour.gameStats, secondsLeft: remainingSecs }
                            };
                        }
                        return tour;
                    } else {
                        changed = true;
                        const currentItem = tour.blinds[tour.gameStats.currentStepIdx];
                        if (currentItem && currentItem.type === 'break') {
                            playSoundEffect(tour.soundsConfig.breakEnd || 'Chime Bell');
                        } else {
                            playSoundEffect(tour.soundsConfig.nextLevel || 'Boxing Bell');
                        }

                        const nextIdx = tour.gameStats.currentStepIdx + 1;
                        if (nextIdx < tour.blinds.length) {
                            const nextStep = tour.blinds[nextIdx];
                            const nextLengthSecs = (nextStep.length || 15) * 60;
                            return {
                                ...tour,
                                gameStats: {
                                    ...tour.gameStats,
                                    currentStepIdx: nextIdx,
                                    secondsLeft: nextLengthSecs,
                                    targetEndTime: now + (nextLengthSecs * 1000)
                                }
                            };
                        } else {
                            return {
                                ...tour,
                                gameStats: { ...tour.gameStats, secondsLeft: 0, targetEndTime: null, isPaused: true, isFinished: true }
                            };
                        }
                    }
                });

                if (changed) {
                    return { ...prevState, tours: newTours };
                }
                return prevState;
            });
        }, 500);
        return () => clearInterval(timer);
    }, []);

    const updateDraftConfig = (field, value) => {
        setDraftConfigState(prev => ({
            ...prev,
            config: { ...prev.config, [field]: value }
        }));
    };

    const updateDraftFontSize = (field, val) => {
        setDraftConfigState(prev => ({
            ...prev,
            config: {
                ...prev.config,
                fontCustomSizes: {
                    ...(prev.config.fontCustomSizes || {}),
                    [field]: Number(val)
                }
            }
        }));
    };

    const handleFileUploadDraft = (e, configField) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 800;
                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    updateDraftConfig(configField, canvas.toDataURL('image/jpeg', 0.75));
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    };

    const handleStatChange = (field, delta) => {
        setAppState(prev => {
            const nextState = {
                ...prev,
                tours: prev.tours.map(t => {
                    if (t.id === selectedTourId) {
                        return {
                            ...t,
                            gameStats: {
                                ...t.gameStats,
                                [field]: Math.max(0, (t.gameStats[field] || 0) + delta)
                            }
                        };
                    }
                    return t;
                })
            };
            if (window.saveTournamentsToCloud) window.saveTournamentsToCloud(nextState);
            return nextState;
        });
    };

    const togglePauseTour = (tourId) => {
        const now = Date.now();
        setAppState(prev => {
            const nextState = {
                ...prev,
                tours: prev.tours.map(t => {
                    if (t.id === tourId) {
                        const willPause = !t.gameStats.isPaused;
                        if (willPause) {
                            return {
                                ...t,
                                gameStats: { ...t.gameStats, isPaused: true, targetEndTime: null }
                            };
                        } else {
                            return {
                                ...t,
                                gameStats: { ...t.gameStats, isPaused: false, isFinished: false, targetEndTime: now + (t.gameStats.secondsLeft * 1000) }
                            };
                        }
                    }
                    return t;
                })
            };
            if (window.saveTournamentsToCloud) window.saveTournamentsToCloud(nextState);
            return nextState;
        });
    };

    const finishTour = (tourId) => {

            setAppState(prev => {
                const nextState = {
                    ...prev,
                    tours: prev.tours.map(t => {
                        if (t.id === tourId) {
                            return {
                                ...t,
                                gameStats: { ...t.gameStats, isPaused: true, isFinished: true, targetEndTime: null }
                            };
                        }
                        return t;
                    })
                };
                if (window.saveTournamentsToCloud) window.saveTournamentsToCloud(nextState);
                return nextState;
            });
        }
    };

    const adjustTimerSeconds = (tourId, deltaSeconds) => {
        const now = Date.now();
        setAppState(prev => {
            const nextState = {
                ...prev,
                tours: prev.tours.map(t => {
                    if (t.id === tourId) {
                        const newSecs = Math.max(0, t.gameStats.secondsLeft + deltaSeconds);
                        return {
                            ...t,
                            gameStats: {
                                ...t.gameStats,
                                secondsLeft: newSecs,
                                targetEndTime: t.gameStats.isPaused ? null : now + (newSecs * 1000)
                            }
                        };
                    }
                    return t;
                })
            };
            if (window.saveTournamentsToCloud) window.saveTournamentsToCloud(nextState);
            return nextState;
        });
    };

    const addNewTournament = () => {

        newTour.gameStats.isPaused = true;
        newTour.gameStats.targetEndTime = null;

        setAppState(prev => {

            return nextState;

    const removeTournament = (tourId) => {

            return;
        }

                if (window.saveTournamentsToCloud) window.saveTournamentsToCloud(nextState);

    const openSinglePopoutWindow = (targetTourId) => {

                    <span className="bg-red-950/90 border border-red-600/50 text-red-400 font-extrabold px-2.5 py-1 rounded tracking-wider uppercase">SNAP CALL POKER</span>
                    <span className="text-gray-300 font-semibold">| {activeTour.config.clubName}</span>
                </div>
                <div className="flex items-center space-x-1.5 bg-black/60 p-1 rounded-xl border border-gold/30">
                    <button onClick={() => setActiveView('combined-dashboard')} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer ${activeView === 'combined-dashboard' ? 'bg-gradient-to-r from-amber-500 to-yellow-600 text-black shadow' : 'text-gray-300 hover:text-white'}`}>
                        <i className="fa-solid fa-trophy mr-1"></i> BXH & Tour
                    </button>
                    <button onClick={() => navigateToProtectedView('pos-orders')} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer ${activeView === 'pos-orders' ? 'bg-gradient-to-r from-amber-500 to-yellow-600 text-black shadow' : 'text-gray-300 hover:text-white'}`}>
                        <i className="fa-solid fa-cart-shopping mr-1"></i> Đặt Đơn (POS)
                    </button>
                    <button onClick={() => navigateToProtectedView('player-tv')} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer ${activeView === 'player-tv' ? 'bg-gradient-to-r from-amber-500 to-yellow-600 text-black shadow' : 'text-gray-300 hover:text-white'}`}>

                    </button>
                    <button onClick={() => navigateToProtectedView('admin')} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer ${activeView === 'admin' ? 'bg-gradient-to-r from-amber-500 to-yellow-600 text-black shadow' : 'text-amber-400 hover:text-amber-300'}`}>
                        <i className="fa-solid fa-sliders mr-1"></i> Admin Setup
                    </button>
                    {isAdminLoggedIn && (

                            <div className="gold-border-box bg-black/90 backdrop-blur-md rounded-3xl p-5 shadow-2xl space-y-4 border border-gold/30">
                                <div className="flex items-center justify-between border-b border-gold/30 pb-3">
                                    <div className="flex items-center gap-2">
                                        <i className="fa-solid fa-layer-group text-amber-400 text-lg"></i>
                                        <h3 className="font-cinzel text-lg font-bold text-gold-bright tracking-wider">THÔNG TIN TOUR</h3>
                                    </div>
                                    <div className="flex items-center gap-1 overflow-x-auto">
                                        {tournaments.map(t => (
                                            <button key={t.id} onClick={() => setSelectedTourId(t.id)} className={`px-2.5 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1 cursor-pointer ${selectedTourId === t.id ? 'bg-amber-500 text-black font-black shadow' : 'bg-gray-900 text-gray-300 border border-gray-800'}`}>
                                                <span className={`w-2 h-2 rounded-full ${t.gameStats.isFinished ? 'bg-gray-500' : (t.gameStats.isPaused ? 'bg-red-500' : 'bg-emerald-400')}`}></span>
                                                {t.config.name}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="space-y-3">
                                    <div className="text-center bg-black/60 p-4 rounded-2xl border border-gold/20">
                                        <div className="text-2xl font-black font-cinzel text-amber-300 mb-1">{activeTour.config.name}</div>
                                        <div className="text-xs text-gray-400">{activeTour.config.clubName} • {activeTour.config.subTitle}</div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2 text-xs">
                                        <div className="bg-gray-900/80 p-3 rounded-xl border border-gray-800"><span className="text-gray-400 block mb-0.5 font-semibold">BUY-IN</span><span className="text-white font-extrabold text-base">{activeTour.config.buyIn}</span></div>
                                        <div className="bg-gray-900/80 p-3 rounded-xl border border-gray-800"><span className="text-gray-400 block mb-0.5 font-semibold">REBUY</span><span className="text-white font-extrabold text-base">{activeTour.config.rebuyPrice}</span></div>
                                        <div className="bg-gray-900/80 p-3 rounded-xl border border-gray-800"><span className="text-gray-400 block mb-0.5 font-semibold">STARTING STACK</span><span className="text-amber-400 font-extrabold text-base">{activeTour.config.startingStack.toLocaleString()}</span></div>
                                        <div className="bg-gray-900/80 p-3 rounded-xl border border-gray-800"><span className="text-gray-400 block mb-0.5 font-semibold">REG END</span><span className="text-white font-extrabold text-base">Level {activeTour.config.regEndLevel}</span></div>
                                    </div>
                                    {activeTour.gameStats.isFinished ? (
                                        <div className="bg-gradient-to-b from-gray-900 to-black/90 border border-gray-700 rounded-2xl p-4 text-center">
                                            <div className="text-gold-bright font-black text-sm uppercase">🏆 TOUR ĐÃ KẾT THÚC</div>
                                        </div>
                                    ) : preTourCountdownSecs > 0 ? (
                                        <div className="bg-gradient-to-b from-amber-950/70 to-black/90 border border-gold/40 rounded-2xl p-4 text-center">
                                            <div className="text-amber-400 font-bold text-xs uppercase mb-1">KHAI MẠC: {activeTour.config.scheduledStartDate} ({activeTour.config.scheduledStartTime})</div>
                                            <div className="font-timer text-3xl font-black text-gold-bright">{formatTimeHHMMSS ? formatTimeHHMMSS(preTourCountdownSecs) : preTourCountdownSecs}</div>
                                        </div>
                                    ) : (
                                        <div className="bg-gradient-to-b from-emerald-950/80 to-black/90 border border-emerald-500/50 rounded-2xl p-4 text-center">
                                            <div className="text-emerald-400 font-black text-sm uppercase">🟢 TOUR ĐANG DIỄN RA</div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        <div className="lg:col-span-7 space-y-4">
                            <div className="gold-border-box bg-black/85 backdrop-blur-md rounded-3xl p-4 sm:p-5 shadow-2xl flex flex-col justify-between">
                                <div>
                                    <div className="flex justify-between items-center border-b border-gold/30 pb-3 mb-3">
                                        <div className="flex items-center gap-2"><i className="fa-solid fa-trophy text-amber-400 text-lg"></i><h3 className="font-cinzel text-lg font-bold text-gold-bright tracking-wider">BẢNG XẾP HẠNG ELO HỘI VIÊN</h3></div>
                                        <span className="text-[10px] text-gray-400 font-bold bg-amber-950/60 border border-amber-500/40 px-2 py-0.5 rounded">TOP 10</span>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-xs sm:text-sm">
                                            <thead>
                                                <tr className="border-b border-gray-800 text-gray-400 text-[11px] uppercase">
                                                    <th className="py-2 px-1 text-center w-12">HẠNG</th>
                                                    <th className="py-2 px-2">TÊN HỘI VIÊN</th>
                                                    <th className="py-2 px-2 text-right">THÁNG</th>
                                                    <th className="py-2 px-2 text-right">QUÝ 4</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-800/60 font-medium">
                                                {mockLeaderboardData.map((player) => (
                                                    <tr key={player.rank} className="hover:bg-amber-500/10 transition">
                                                        <td className="py-2.5 px-1 text-center font-bold text-amber-400">{player.rank}</td>
                                                        <td className="py-2.5 px-2 font-semibold text-white">{player.name}</td>
                                                        <td className="py-2.5 px-2 text-right font-bold text-amber-300">{player.monthElo.toLocaleString()}</td>
                                                        <td className="py-2.5 px-2 text-right font-extrabold text-gold-bright">{player.quarterElo.toLocaleString()}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                )}

                {activeView === 'pos-orders' && (
                    <div className="space-y-5 max-w-6xl mx-auto w-full">
                        <div className="gold-border-box bg-black/85 backdrop-blur-md rounded-3xl p-5 shadow-2xl border border-gold/30 text-center py-16">
                            <h2 className="font-cinzel text-2xl font-bold text-gold-bright mb-2">MODULE POS THU NGÂN & ĐẶT ĐƠN</h2>
                            <p className="text-gray-400 text-sm">Hệ thống đang sẵn sàng tích hợp giỏ hàng và thanh toán gộp Bill.</p>
                        </div>
                    </div>
                )}

                {activeView === 'player-tv' && (
                    <div className="w-full space-y-6">
                        <TournamentTVCard tour={activeTour} openSinglePopout={openSinglePopoutWindow} />
                    </div>
                )}

                {activeView === 'admin' && (
                    <div className="space-y-6 w-full">
                        <div className="bg-black/60 border border-gold/30 rounded-xl p-3 flex flex-wrap items-center justify-between gap-2 backdrop-blur-md">
                            <div className="flex items-center space-x-2 overflow-x-auto py-1">
                                <span className="text-xs text-gold-bright uppercase font-bold mr-1">Danh Sách Tour:</span>
                                {tournaments.map(t => (
                                    <div key={t.id} onClick={() => setSelectedTourId(t.id)} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-2 cursor-pointer select-none border ${selectedTourId === t.id ? 'bg-gradient-to-r from-amber-500 to-yellow-600 text-black border-gold shadow' : 'bg-gray-900/80 text-gray-300 border-gray-700'}`}>
                                        <span className={`w-2 h-2 rounded-full ${t.gameStats.isFinished ? 'bg-gray-500' : (t.gameStats.isPaused ? 'bg-red-500' : 'bg-emerald-400')}`}></span>
                                        <span>{t.config.name}</span>
                                        {tournaments.length > 1 && (
                                            <button type="button" onClick={(e) => { e.stopPropagation(); removeTournament(t.id); }} className="hover:bg-black/20 rounded px-1 text-xs font-black text-red-400">✕</button>
                                        )}
                                    </div>
                                ))}
                            </div>
                            <div className="flex items-center space-x-2">
                                <button onClick={addNewTournament} className="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow cursor-pointer transition">+ Tạo Tour Mới</button>
                            </div>
                        </div>

                        <div className="bg-black/70 border border-gold/40 rounded-2xl p-6 shadow-2xl backdrop-blur-md">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-lg font-bold text-gold-bright">Cấu Hình Tournament: <span className="text-white">{draftConfigState.config.name}</span></h2>
                                <button onClick={applyDraftChangesToLive} className="px-5 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-extrabold text-xs shadow-lg cursor-pointer">CẬP NHẬT HỆ THỐNG</button>
                            </div>
                            <div className="space-y-4 text-xs sm:text-sm">
                                <div>
                                    <label className="block text-gray-400 mb-1 font-semibold">Tên Giải Đấu</label>
                                    <input type="text" value={draftConfigState.config.name} onChange={(e) => updateDraftConfig('name', e.target.value)} className="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white font-bold text-base" />
                                </div>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                    <div>
                                        <label className="block text-gray-400 mb-1 font-semibold">Buy-in</label>
                                        <input type="number" value={draftConfigState.config.buyIn} onChange={(e) => updateDraftConfig('buyIn', Number(e.target.value))} className="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white font-bold" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-400 mb-1 font-semibold">Rebuy Price</label>
                                        <input type="number" value={draftConfigState.config.rebuyPrice} onChange={(e) => updateDraftConfig('rebuyPrice', Number(e.target.value))} className="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white font-bold" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-400 mb-1 font-semibold">Starting Stack</label>
                                        <input type="number" value={draftConfigState.config.startingStack} onChange={(e) => updateDraftConfig('startingStack', Number(e.target.value))} className="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white font-bold" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-400 mb-1 font-semibold">Reg End Level</label>
                                        <input type="number" value={draftConfigState.config.regEndLevel} onChange={(e) => updateDraftConfig('regEndLevel', Number(e.target.value))} className="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-amber-400 font-bold" />
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-black/70 border border-gold/40 rounded-2xl p-5 shadow-2xl backdrop-blur-md space-y-4">
                            <div className="flex flex-wrap justify-between items-center border-b border-gray-800 pb-3 gap-2">
                                <h3 className="text-sm font-bold text-gold-bright uppercase">Điều Khiển Trực Tiếp: <span className="text-white">{activeTour.config.name}</span></h3>
                                <div className="flex flex-wrap items-center gap-2">
                                    <button onClick={() => togglePauseTour(activeTour.id)} className={`px-5 py-1.5 rounded text-xs font-black shadow transition cursor-pointer ${activeTour.gameStats.isPaused ? 'bg-emerald-600 hover:bg-emerald-500 text-white' : 'bg-amber-600 hover:bg-amber-500 text-white'}`}>
                                        {activeTour.gameStats.isPaused ? '▶ START / RESUME' : '⏸ PAUSE'}
                                    </button>
                                    <button onClick={() => finishTour(activeTour.id)} className="px-4 py-1.5 rounded bg-red-900/80 hover:bg-red-800 text-red-200 border border-red-600/50 text-xs font-bold transition cursor-pointer">🏁 KẾT THÚC</button>
                                </div>
                            </div>
                            <div className="grid grid-cols-3 gap-3">
                                {[
                                    { label: 'Buy-ins', field: 'buyIns' },
                                    { label: 'Eliminated', field: 'eliminated' },
                                    { label: 'Re-buys', field: 'rebuys' }
                                ].map(({ label, field }) => (
                                    <div key={field} className="bg-black/50 p-3 rounded-xl border border-gray-800 text-center">
                                        <div className="text-xs text-gray-400 uppercase font-bold mb-1">{label}</div>
                                        <div className="text-2xl font-black text-gold-bright my-1">{activeTour.gameStats[field]}</div>
                                        <div className="flex justify-center space-x-2 mt-2">
                                            <button onClick={() => handleStatChange(field, -1)} className="w-8 h-8 bg-gray-800 hover:bg-gray-700 rounded-lg font-extrabold text-white cursor-pointer">-</button>
                                            <button onClick={() => handleStatChange(field, 1)} className="w-8 h-8 bg-amber-500 hover:bg-amber-400 rounded-lg font-extrabold text-black cursor-pointer">+</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                )}
            </main>
        </div>
    );
}

ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
