        window.popoutBroadcastChannel = new BroadcastChannel('snapcall_popout_sync');

        window.getTodayDateString = function() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        };

        window.defaultBlindsList = [
            { id: 1, type: 'level', sb: 100, bb: 100, ante: 100, length: 17 },

        window.defaultTourTemplate = function(name, id, buyIn, rebuyPrice) {
            return {

                    secondsLeft: 611,
                    targetEndTime: null,
                    isPaused: true,
                    isFinished: false
                }
            };
        };

        window.initCloudSync = async function(onDataReceived, onSyncStatusChange) {
            if (!SUPABASE_URL || !SUPABASE_ANON_KEY || !window.supabase) {
                console.warn("Supabase SDK chưa sẵn sàng.");
                onSyncStatusChange(false);
                return;
            }

            try {
                const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                onSyncStatusChange(true);

                const fetchCloudData = async () => {
                    try {
                        const { data, error } = await supabaseClient
                            .from('tournaments')
                            .select('data')
                            .eq('id', 'live_state')
                            .maybeSingle();

                        if (data && data.data && data.data.tours && Array.isArray(data.data.tours) && data.data.tours.length > 0) {
                            onDataReceived(data.data, true);
                        } else {
                            const initialDefaultState = {
                                tours: [
                                    window.defaultTourTemplate('MONTER STACK', 101, 100, 100)
                                ],
                                presets: [],
                                selectedTourId: 101,
                                lastUpdated: Date.now()
                            };
                            await supabaseClient.from('tournaments').upsert({ id: 'live_state', data: initialDefaultState, updated_at: new Date().toISOString() });
                            onDataReceived(initialDefaultState, true);
                        }
                    } catch(e) {
                        console.warn("Fetch Error:", e);
                    }
                };
                
                await fetchCloudData();

                const channel = supabaseClient
                    .channel('room_poker_live_v20', { config: { broadcast: { self: true } } })
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'tournaments' }, payload => {
                        if (payload.new && payload.new.data) {
                            onDataReceived(payload.new.data, true);
                        }
                    })
                    .on('broadcast', { event: 'tour_update' }, payload => {
                        if (payload.payload && payload.payload.data) {
                            onDataReceived(payload.payload.data, true);
                        }
                    })
                    .subscribe();

                window.saveTournamentsToCloud = async (appDataState) => {
                    window.popoutBroadcastChannel.postMessage({ data: appDataState });

                    try {
                        const payloadData = {
                            ...appDataState,
                            lastUpdated: Date.now()
                        };

                        channel.send({
                            type: 'broadcast',
                            event: 'tour_update',
                            payload: { data: payloadData }
                        });

                        await supabaseClient
                            .from('tournaments')
                            .upsert({ id: 'live_state', data: payloadData, updated_at: new Date().toISOString() });
                    } catch (e) {
                        console.warn("Lỗi lưu Supabase Cloud:", e);
                    }
                };
            } catch (err) {
                console.warn("Lỗi kết nối Supabase Cloud Sync:", err);
                onSyncStatusChange(false);
            }
        };
    </script>

function TournamentTVCard({ tour, openSinglePopout, isPopoutWindow }) {
    if (!tour) return <div className="text-white text-center p-10 font-bold">Đang tải thông tin Tour...</div>;
    const currentStep = tour.blinds[tour.gameStats.currentStepIdx] || tour.blinds[0];

    const getCalculatedLevelNumber = (blindsList, stepIndex) => {
        let levelNum = 0;
        for (let i = 0; i <= stepIndex && i < blindsList.length; i++) {
            if (blindsList[i].type === 'level') levelNum++;
        }
        return levelNum;
    };

    const getSecondsToNextBreak = (t) => {
        let totalSecs = t.gameStats.secondsLeft;
        for (let i = t.gameStats.currentStepIdx + 1; i < t.blinds.length; i++) {
            if (t.blinds[i].type === 'break') break;
            totalSecs += t.blinds[i].length * 60;
        }
        return totalSecs;
    };

    const getNextLevelInfo = (t) => {
        for (let i = t.gameStats.currentStepIdx + 1; i < t.blinds.length; i++) {
            if (t.blinds[i].type === 'level') {
                return `${t.blinds[i].sb.toLocaleString()}/${t.blinds[i].bb.toLocaleString()}`;
            } else if (t.blinds[i].type === 'break') {
                return 'Break Time';
            }
        }
        return 'MAX LEVEL REACHED';
    };

    const formatTime = (totalSeconds) => {
        const mins = Math.floor(Math.max(0, totalSeconds) / 60);
        const secs = Math.floor(Math.max(0, totalSeconds) % 60);
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    };

    const formatTimeHHMMSS = (totalSeconds) => {
        const hrs = Math.floor(totalSeconds / 3600);
        const mins = Math.floor((totalSeconds % 3600) / 60);
        const secs = Math.floor(totalSeconds % 60);
        return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    };

    const currentLevelNum = getCalculatedLevelNumber(tour.blinds, tour.gameStats.currentStepIdx);
    const totalEntries = tour.gameStats.buyIns + tour.gameStats.rebuys;
    const totalPointsFromPayouts = tour.payouts.reduce((sum, p) => sum + (Number(p.value) || 0), 0);
    const totalChipsInPlay = totalEntries * tour.config.startingStack;
    const playersLeft = Math.max(0, tour.gameStats.buyIns - tour.gameStats.eliminated);
    const avgStack = playersLeft > 0 ? Math.round(totalChipsInPlay / playersLeft) : 0;
    const nextBreakTime = formatTimeHHMMSS(getSecondsToNextBreak(tour));
    
    const fontSizes = tour.config.fontCustomSizes || { brandPx: 30, headerPx: 56, subHeaderPx: 18, timerPx: 120, blindsPx: 54, nextLevelPx: 46, statsPx: 30, payoutsPx: 24, levelBadgePx: 22, tourInfoPx: 18 };
    const themeStyle = getThemeStyles(tour.config.colorTheme);
    const selectedFontClass = tour.config.selectedFont || 'font-montserrat';
    const logoSize = tour.config.logoSizePx || 80;
    const qrSize = tour.config.qrSizePx || 70;

                backgroundPosition: 'center'
            }}

                    onClick={() => openSinglePopout(tour.id)}

                >
                    <i className="fa-solid fa-up-right-from-square"></i> Popout TV
                </button>
            )}

            {tour.config.logoUrl && (
                <div className="absolute top-3 left-3 z-20">
                    <img src={tour.config.logoUrl} alt="Club Logo" style={{ height: `${logoSize}px` }} className="object-contain drop-shadow-md" />
                </div>
            )}

            <div className="flex flex-col md:grid md:grid-cols-12 gap-4 md:gap-2 items-center flex-1 w-full my-auto">
                <div className="w-full md:col-span-6 md:order-2 text-center space-y-1.5 sm:space-y-2 my-auto px-1">
                    <div className="text-center mb-1">
                        {(tour.config.showClubName !== false || tour.config.showSubTitle !== false) && (
                            <div className="flex flex-col items-center mb-1">
                                {tour.config.showClubName !== false && (
                                    <div className="text-gold font-extrabold tracking-[0.2em] font-cinzel text-center" style={{ fontSize: `${fontSizes.brandPx || 30}px` }}>
                                        {tour.config.clubName}

                        </span>
                    </div>

                    </div>

                    <div>
                        <div className="text-gray-400 font-bold tracking-wider uppercase mb-0.5" style={{ fontSize: `${Math.max(9, (fontSizes.statsPx || 30) - 10)}px` }}>RE-BUY</div>
                        <div className="text-white font-black" style={{ fontSize: `${fontSizes.statsPx || 30}px` }}>{tour.gameStats.rebuys}</div>
                    </div>

                    <div>
                        <div className="text-gray-400 font-bold tracking-wider uppercase mb-0.5" style={{ fontSize: `${Math.max(9, (fontSizes.statsPx || 30) - 10)}px` }}>TOTAL ENTRIES</div>

                    </div>

                    <div>
                        <div className="text-gray-400 font-bold tracking-wider uppercase mb-0.5" style={{ fontSize: `${Math.max(9, (fontSizes.statsPx || 30) - 10)}px` }}>TOTAL STACK</div>
                        <div className="text-white font-black" style={{ fontSize: `${fontSizes.statsPx || 30}px` }}>{totalChipsInPlay.toLocaleString()}</div>
                    </div>

                    <div>
                        <div className="text-gray-400 font-bold tracking-wider uppercase mb-0.5" style={{ fontSize: `${Math.max(9, (fontSizes.statsPx || 30) - 10)}px` }}>AVG STACK</div>
                        <div className="text-white font-black" style={{ fontSize: `${fontSizes.statsPx || 30}px` }}>{avgStack.toLocaleString()}</div>
                    </div>

                    <div className="md:pt-1.5 md:border-t border-gray-800">
                        <div className="text-gray-400 font-bold tracking-wider uppercase mb-0.5" style={{ fontSize: `${Math.max(9, (fontSizes.statsPx || 30) - 10)}px` }}>NEXT BREAK</div>
                        <div className="text-white font-black" style={{ fontSize: `${fontSizes.statsPx || 30}px` }}>{nextBreakTime}</div>
                    </div>
                </div>

                <div className="w-full md:col-span-3 md:order-3 text-right flex flex-col justify-center h-full border-t md:border-t-0 border-gold/20 pt-3 md:pt-0 my-auto">
                    <div className="w-full text-center md:text-right my-auto">
                        <div className="text-gray-400 font-semibold tracking-widest uppercase mb-1" style={{ fontSize: `${Math.max(9, (fontSizes.payoutsPx || 24) - 6)}px` }}>PRIZE POOL</div>
                        
                        <div className="font-black text-gold-bright tracking-tight mb-2 sm:mb-3" style={{ fontSize: `${(fontSizes.payoutsPx || 24) + 10}px` }}>
                            {totalPointsFromPayouts.toLocaleString()} TOKEN
                        </div>

                        <div className="space-y-1.5 text-left border-t border-gray-800/80 pt-2.5 max-w-xs ml-auto" style={{ fontSize: `${fontSizes.payoutsPx || 24}px` }}>
                            {tour.payouts.map((p, idx) => (
                                <div key={idx} className="flex justify-between items-center font-bold px-1">
                                    <span className="text-gray-300">{p.place}</span>
                                    <span className="text-white">{p.value}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    {tour.config.qrCodeUrl && (
                        <div className="mt-2 pt-1 border-t border-gray-800/80 flex justify-end items-center gap-2">
                            <div className="text-right">
                                <div className="text-[9px] font-bold uppercase" style={{ color: themeStyle.blindsColor }}>Quét QR</div>
                                <div className="text-[8px] text-gray-400">Đăng ký & thông tin</div>
                            </div>
                            <img src={tour.config.qrCodeUrl} alt="QR Code" style={{ height: `${qrSize}px`, width: `${qrSize}px` }} className="object-contain rounded border border-gold/40 p-0.5 bg-black/60" />
                        </div>
                    )}
                </div>
            </div>

            <div className="mt-3 pt-2 border-t border-gray-800/80 flex justify-between items-center text-[10px] text-gray-500 font-medium">
                <div>SNAP CALL • BOARD GAME & COFFEE • EST. 2026</div>
                <div>Powered by Snap Call</div>
            </div>
        </div>
    );
}

function App() {
    const [activeView, setActiveView] = useState('combined-dashboard');
    const [wizardStep, setWizardStep] = useState(1);
    const [isCloudSynced, setIsCloudSynced] = useState(false);
    const [draggedBlindIdx, setDraggedBlindIdx] = useState(null);
    const [searchPhoneInput, setSearchPhoneInput] = useState('');
    const [searchResultPlayer, setSearchResultPlayer] = useState(null);
    const [showFontSizesCollapse, setShowFontSizesCollapse] = useState(false);
    const [preTourCountdownSecs, setPreTourCountdownSecs] = useState(0);

    const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(() => {
        return localStorage.getItem('snapcall_admin_auth') === 'true';
    });
    const [showLoginModal, setShowLoginModal] = useState(false);
    const [targetProtectedView, setTargetProtectedView] = useState('admin');
    const [idInput, setIdInput] = useState('');
    const [pinInput, setPinInput] = useState('');
    const [loginError, setLoginError] = useState('');

    const isRemoteUpdatingRef = useRef(false);

    const [appState, setAppState] = useState(() => {
        return {
            tours: [
                window.defaultTourTemplate('MONTER STACK', 101, 100, 100)
            ],
            presets: [],
            selectedTourId: 101
        };
    });

    const tournaments = appState.tours || [];
    const presets = appState.presets || [];
    const selectedTourId = appState.selectedTourId || tournaments[0]?.id || 101;

    const activeTour = tournaments.find(t => t.id === selectedTourId) || tournaments[0] || window.defaultTourTemplate('MONTER STACK', 101, 100, 100);

    const [draftConfigState, setDraftConfigState] = useState(() => JSON.parse(JSON.stringify(activeTour)));

    useEffect(() => {
        setDraftConfigState(JSON.parse(JSON.stringify(activeTour)));
    }, [selectedTourId, activeTour.id]);

    useEffect(() => {
        const calcRemaining = () => {
            const startDateStr = activeTour.config.scheduledStartDate || window.getTodayDateString();
            const startTimeStr = activeTour.config.scheduledStartTime || '13:00';
            const [yyyy, mm, dd] = startDateStr.split('-').map(Number);
            const [hrs, mins] = startTimeStr.split(':').map(Number);
            const targetDate = new Date(yyyy, mm - 1, dd, hrs, mins, 0);
            return Math.floor((targetDate.getTime() - Date.now()) / 1000);
        };

        setPreTourCountdownSecs(calcRemaining());
        const interval = setInterval(() => setPreTourCountdownSecs(calcRemaining()), 1000);
        return () => clearInterval(interval);
    }, [activeTour.config.scheduledStartDate, activeTour.config.scheduledStartTime]);

    const setSelectedTourId = (newTourId) => {
        setAppState(prev => {
            const nextState = { ...prev, selectedTourId: newTourId };
            if (window.saveTournamentsToCloud) {
                window.saveTournamentsToCloud(nextState);
            }
            return nextState;
        });
    };

    useEffect(() => {
        if (window.initCloudSync) {
            window.initCloudSync(
                (cloudState) => {
                    if (cloudState && cloudState.tours) {
                        isRemoteUpdatingRef.current = true;
                        setAppState(prev => {
                            const tourExists = cloudState.tours.some(t => t.id === prev.selectedTourId);
                            const validTourId = tourExists ? prev.selectedTourId : (cloudState.tours[0]?.id || 101);
                            return {
                                ...cloudState,
                                selectedTourId: validTourId
                            };
                        });
                        setTimeout(() => { isRemoteUpdatingRef.current = false; }, 300);
                    }
                },
                (status) => setIsCloudSynced(status)
            );
        }
    }, []);

    const applyDraftChangesToLive = () => {
        setAppState(prev => {
            const nextState = {
                ...prev,
                tours: prev.tours.map(t => t.id === selectedTourId ? JSON.parse(JSON.stringify(draftConfigState)) : t)
            };
            if (window.saveTournamentsToCloud) {
                window.saveTournamentsToCloud(nextState);
            }
            return nextState;
        });
        alert(`Đã CẬP NHẬT thành công cài đặt cho Tour "${draftConfigState.config.name}"!`);
    };

    const addNewTournament = () => {
        const newId = Date.now();
        const newTour = window.defaultTourTemplate(`TOUR #${tournaments.length + 1}`, newId, 100, 100);
        setAppState(prev => {
            const nextState = {
                ...prev,
                tours: [...prev.tours, newTour],
                selectedTourId: newId
            };
            if (window.saveTournamentsToCloud) {
                window.saveTournamentsToCloud(nextState);
            }
            return nextState;
        });
    };

    const removeTournament = (tourIdToRemove) => {
        if (tournaments.length <= 1) return;
        setAppState(prev => {
            const newTours = prev.tours.filter(t => t.id !== tourIdToRemove);
            const newSelectedId = prev.selectedTourId === tourIdToRemove ? newTours[0].id : prev.selectedTourId;
            const nextState = {
                ...prev,
                tours: newTours,
                selectedTourId: newSelectedId
            };
            if (window.saveTournamentsToCloud) {
                window.saveTournamentsToCloud(nextState);
            }
            return nextState;
        });
    };

    const handleLoginSubmit = (e) => {
        e.preventDefault();
        if (idInput.trim() === 'Admin' && pinInput === '123456') {
            setIsAdminLoggedIn(true);
            localStorage.setItem('snapcall_admin_auth', 'true');
            setShowLoginModal(false);
            setIdInput('');
            setPinInput('');
            setLoginError('');
            setActiveView(targetProtectedView);
        } else {
            setLoginError('ID hoặc Mật khẩu không chính xác!');
        }
    };

    const handleLogout = () => {
        setIsAdminLoggedIn(false);
        localStorage.removeItem('snapcall_admin_auth');
        setActiveView('combined-dashboard');
    };

    const navigateToProtectedView = (viewName) => {
        if (isAdminLoggedIn) {
            setActiveView(viewName);
        } else {
            setTargetProtectedView(viewName);
            setShowLoginModal(true);
        }
    };

    const playSoundEffect = (soundType) => {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (soundType === 'Boxing Bell') {
                [0, 150].forEach(delay => {
                    setTimeout(() => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(1200, ctx.currentTime);
                        gain.gain.setValueAtTime(0.5, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.8);
                    }, delay);
                });
            } else if (soundType === 'Chime Bell') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.4, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 1.2);
            } else if (soundType === 'Digital Beep') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(1500, ctx.currentTime);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.25);
            } else if (soundType === 'Whistle') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(2400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(2800, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.4, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            }
        } catch (e) {
            console.log("Audio play error:", e);
        }
    };

    useEffect(() => {
        const timer = setInterval(() => {
            if (isRemoteUpdatingRef.current) return;
            const now = Date.now();
            setAppState(prevState => {
                let changed = false;
                const newTours = prevState.tours.map(tour => {
                    if (tour.gameStats.isPaused || tour.gameStats.isFinished || !tour.gameStats.targetEndTime) {
                        return tour;
                    }

                    const remainingSecs = Math.max(0, Math.ceil((tour.gameStats.targetEndTime - now) / 1000));

                    if (remainingSecs > 0) {
                        if (remainingSecs !== tour.gameStats.secondsLeft) {
                            changed = true;
                            return {
                                ...tour,
                                gameStats: { ...tour.gameStats, secondsLeft: remainingSecs }
                            };
                        }
                        return tour;
                    } else {
                        changed = true;
                        const currentItem = tour.blinds[tour.gameStats.currentStepIdx];
                        if (currentItem && currentItem.type === 'break') {
                            playSoundEffect(tour.soundsConfig.breakEnd || 'Chime Bell');
                        } else {
                            playSoundEffect(tour.soundsConfig.nextLevel || 'Boxing Bell');
                        }

                        const nextIdx = tour.gameStats.currentStepIdx + 1;
                        if (nextIdx < tour.blinds.length) {
                            const nextStep = tour.blinds[nextIdx];
                            const nextLengthSecs = (nextStep.length || 15) * 60;
                            return {
                                ...tour,
                                gameStats: {
                                    ...tour.gameStats,
                                    currentStepIdx: nextIdx,
                                    secondsLeft: nextLengthSecs,
                                    targetEndTime: now + (nextLengthSecs * 1000)
                                }
                            };
                        } else {
                            return {
                                ...tour,
                                gameStats: { ...tour.gameStats, secondsLeft: 0, targetEndTime: null, isPaused: true, isFinished: true }
                            };
                        }
                    }
                });

                if (changed) {
                    return { ...prevState, tours: newTours };
                }
                return prevState;
            });
        }, 500);
        return () => clearInterval(timer);
    }, []);

    const updateDraftConfig = (field, value) => {
        setDraftConfigState(prev => ({
            ...prev,
            config: { ...prev.config, [field]: value }
        }));
    };

    const updateDraftFontSize = (field, val) => {
        setDraftConfigState(prev => ({
            ...prev,
            config: {
                ...prev.config,
                fontCustomSizes: {
                    ...(prev.config.fontCustomSizes || {}),
                    [field]: Number(val)
                }
            }
        }));
    };

    const handleBlindFieldChange = (index, field, val) => {
        setDraftConfigState(prev => {
            const newBlinds = [...prev.blinds];
            newBlinds[index] = { ...newBlinds[index], [field]: val };
            return { ...prev, blinds: newBlinds };
        });
    };

    const addBlindLevel = (type) => {
        setDraftConfigState(prev => {
            const lastLevel = [...prev.blinds].reverse().find(b => b.type === 'level') || { sb: 100, bb: 200, ante: 200, length: 15 };
            const newItem = type === 'level' 
                ? { id: Date.now(), type: 'level', sb: lastLevel.sb * 2, bb: lastLevel.bb * 2, ante: lastLevel.ante * 2, length: lastLevel.length }
                : { id: Date.now(), type: 'break', length: 10, title: 'Break', isChipRace: false, chipRaceTitle: '' };
            return { ...prev, blinds: [...prev.blinds, newItem] };
        });
    };

    const removeBlindItem = (index) => {
        setDraftConfigState(prev => {
            if (prev.blinds.length <= 1) return prev;
            return { ...prev, blinds: prev.blinds.filter((_, i) => i !== index) };
        });
    };

    const handleBlindDragStart = (e, index) => {
        setDraggedBlindIdx(index);
        e.dataTransfer.effectAllowed = "move";
    };

    const handleBlindDragOver = (e, index) => {
        e.preventDefault();
        if (draggedBlindIdx === null || draggedBlindIdx === index) return;
        setDraftConfigState(prev => {
            const newBlinds = [...prev.blinds];
            const draggedItem = newBlinds[draggedBlindIdx];
            newBlinds.splice(draggedBlindIdx, 1);
            newBlinds.splice(index, 0, draggedItem);
            return { ...prev, blinds: newBlinds };
        });
        setDraggedBlindIdx(index);
    };

    const handleBlindDragEnd = () => {
        setDraggedBlindIdx(null);
    };

    const handlePayoutChange = (index, field, val) => {
        setDraftConfigState(prev => {
            const newPayouts = [...prev.payouts];
            newPayouts[index] = { ...newPayouts[index], [field]: val };
            return { ...prev, payouts: newPayouts };
        });
    };

    const addPayoutRow = () => {
        setDraftConfigState(prev => ({
            ...prev,
            payouts: [...prev.payouts, { place: `Top ${prev.payouts.length + 1}`, value: 0 }]
        }));
    };

    const removePayoutRow = (index) => {
        setDraftConfigState(prev => ({
            ...prev,
            payouts: prev.payouts.filter((_, i) => i !== index)
        }));
    };

    const togglePauseTour = (tourId) => {
        setAppState(prev => {
            const nextTours = prev.tours.map(t => {
                if (t.id === tourId) {
                    const willPause = !t.gameStats.isPaused;
                    const targetEnd = willPause ? null : (Date.now() + (t.gameStats.secondsLeft * 1000));
                    return {
                        ...t,
                        gameStats: {
                            ...t.gameStats,
                            isPaused: willPause,
                            targetEndTime: targetEnd
                        }
                    };
                }
                return t;
            });
            const nextState = { ...prev, tours: nextTours };
            if (window.saveTournamentsToCloud) {
                window.saveTournamentsToCloud(nextState);
            }
            return nextState;
        });
    };

    const finishTour = (tourId) => {
        setAppState(prev => {
            const nextTours = prev.tours.map(t => {
                if (t.id === tourId) {
                    return {
                        ...t,
                        gameStats: {
                            ...t.gameStats,
                            isFinished: true,
                            isPaused: true,
                            secondsLeft: 0,
                            targetEndTime: null
                        }
                    };
                }
                return t;
            });
            const nextState = { ...prev, tours: nextTours };
            if (window.saveTournamentsToCloud) {
                window.saveTournamentsToCloud(nextState);
            }
            return nextState;
        });
    };

    const handleStatChange = (field, delta) => {
        setAppState(prev => {
            const nextTours = prev.tours.map(t => {
                if (t.id === selectedTourId) {
                    return {
                        ...t,
                        gameStats: {
                            ...t.gameStats,
                            [field]: Math.max(0, t.gameStats[field] + delta)
                        }
                    };
                }
                return t;
            });
            const nextState = { ...prev, tours: nextTours };
            if (window.saveTournamentsToCloud) {
                window.saveTournamentsToCloud(nextState);
            }
            return nextState;
        });
    };

    return (
        <div className="min-h-screen flex flex-col justify-between p-2 sm:p-4 max-w-[1920px] mx-auto">
            <header className="flex flex-wrap justify-between items-center bg-black/60 border border-gold/30 rounded-2xl p-3 mb-4 backdrop-blur-md">
                <div className="flex items-center space-x-3">
                    <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center text-black font-black text-xl shadow-lg">
                        ♠
                    </div>
                    <div>
                        <div className="font-black text-gold-bright text-base sm:text-lg font-cinzel leading-tight">SNAP CALL POKER</div>
                        <div className="text-[10px] text-gray-400 font-semibold tracking-widest">BOARD GAME & COFFEE</div>
                    </div>
                </div>

                <div className="flex items-center space-x-2 my-1 sm:my-0">
                    <button onClick={() => setActiveView('combined-dashboard')} className={`px-4 py-2 rounded-xl font-extrabold text-xs transition cursor-pointer flex items-center gap-1.5 ${activeView === 'combined-dashboard' ? 'bg-amber-500 text-black shadow-lg' : 'bg-gray-900 text-gray-300 hover:text-white'}`}>
                        <i className="fa-solid fa-trophy"></i> BXH & Tour
                    </button>
                    <button onClick={() => setActiveView('tv-display')} className={`px-4 py-2 rounded-xl font-extrabold text-xs transition cursor-pointer flex items-center gap-1.5 ${activeView === 'tv-display' ? 'bg-amber-500 text-black shadow-lg' : 'bg-gray-900 text-gray-300 hover:text-white'}`}>
                        <i className="fa-solid fa-tv"></i> Tour View
                    </button>
                    <button onClick={() => navigateToProtectedView('pos')} className={`px-4 py-2 rounded-xl font-extrabold text-xs transition cursor-pointer flex items-center gap-1.5 ${activeView === 'pos' ? 'bg-amber-500 text-black shadow-lg' : 'bg-gray-900 text-gray-300 hover:text-white'}`}>
                        <i className="fa-solid fa-cart-shopping"></i> Đặt Đơn (POS)
                    </button>
                    <button onClick={() => navigateToProtectedView('admin')} className={`px-4 py-2 rounded-xl font-extrabold text-xs transition cursor-pointer flex items-center gap-1.5 ${activeView === 'admin' ? 'bg-amber-500 text-black shadow-lg' : 'bg-gray-900 text-gray-300 hover:text-white'}`}>
                        <i className="fa-solid fa-sliders"></i> Setup
                    </button>
                </div>
            </header>

            {showLoginModal && (
                <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
                    <div className="bg-gray-900 border border-gold/40 rounded-2xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
                        <div className="flex justify-between items-center border-b border-gray-800 pb-3">
                            <h3 className="font-black text-gold-bright text-base">ĐĂNG NHẬP ADMIN / THU NGÂN</h3>
                            <button onClick={() => setShowLoginModal(false)} className="text-gray-400 hover:text-white font-bold">✕</button>
                        </div>
                        <form onSubmit={handleLoginSubmit} className="space-y-3">
                            <div>
                                <label className="block text-xs font-semibold text-gray-400 mb-1">Tài khoản (ID)</label>
                                <input type="text" value={idInput} onChange={e => setIdInput(e.target.value)} placeholder="Nhập ID Admin" className="w-full bg-black/60 border border-gray-700 rounded-lg p-2.5 text-white font-bold text-sm" />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-gray-400 mb-1">Mật khẩu (PIN)</label>
                                <input type="password" value={pinInput} onChange={e => setPinInput(e.target.value)} placeholder="Nhập PIN" className="w-full bg-black/60 border border-gray-700 rounded-lg p-2.5 text-white font-bold text-sm" />
                            </div>
                            {loginError && <div className="text-red-400 text-xs font-semibold">{loginError}</div>}
                            <button type="submit" className="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-black font-extrabold rounded-xl text-xs uppercase shadow-lg">Xác Nhận Đăng Nhập</button>
                        </form>
                    </div>
                </div>
            )}

            <main className="flex-1 flex flex-col justify-center">
                {activeView === 'combined-dashboard' && (
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 w-full my-auto">
                        <div className="lg:col-span-7 flex flex-col justify-between space-y-4">
                            <div className="bg-black/80 border border-gold/40 rounded-3xl p-5 shadow-2xl space-y-4">
                                <div className="flex justify-between items-center border-b border-gold/30 pb-3">
                                    <h3 className="font-black text-gold-bright tracking-wider text-base uppercase flex items-center gap-2">
                                        <i className="fa-solid fa-layer-group text-gold"></i> THÔNG TIN TOUR
                                    </h3>
                                    <div className="flex space-x-1.5 overflow-x-auto max-w-[60%] py-1">
                                        {tournaments.map(t => (
                                            <button key={t.id} onClick={() => setSelectedTourId(t.id)} className={`px-3 py-1 rounded-full text-[11px] font-extrabold uppercase transition whitespace-nowrap border ${selectedTourId === t.id ? 'bg-amber-500 text-black border-gold shadow' : 'bg-gray-900 text-gray-400 border-gray-800'}`}>
                                                {t.config.name}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="text-center space-y-2 py-2">
                                    <div className="text-2xl sm:text-3xl font-black text-gold-bright font-cinzel tracking-wider">{activeTour.config.name}</div>
                                    <div className="text-xs text-gold/70 font-semibold tracking-widest uppercase">— {activeTour.config.clubName} • {activeTour.config.subTitle} —</div>

                                    <div className="grid grid-cols-2 gap-3 max-w-md mx-auto pt-2">
                                        <div className="bg-black/60 border border-gray-800 rounded-xl p-2.5 text-center">
                                            <div className="text-[10px] text-gray-400 font-bold uppercase">BUY-IN</div>
                                            <div className="text-base font-black text-white">{activeTour.config.buyIn}</div>
                                        </div>
                                        <div className="bg-black/60 border border-gray-800 rounded-xl p-2.5 text-center">
                                            <div className="text-[10px] text-gray-400 font-bold uppercase">REBUY</div>
                                            <div className="text-base font-black text-white">{activeTour.config.rebuyPrice}</div>
                                        </div>
                                        <div className="bg-black/60 border border-gray-800 rounded-xl p-2.5 text-center">
                                            <div className="text-[10px] text-gray-400 font-bold uppercase">STARTING STACK</div>
                                            <div className="text-base font-black text-gold-bright">{activeTour.config.startingStack.toLocaleString()}</div>
                                        </div>
                                        <div className="bg-black/60 border border-gray-800 rounded-xl p-2.5 text-center">
                                            <div className="text-[10px] text-gray-400 font-bold uppercase">REG END</div>
                                            <div className="text-base font-black text-white">Level {activeTour.config.regEndLevel}</div>
                                        </div>
                                    </div>
                                </div>

                                <div className="border border-emerald-500/40 bg-emerald-950/30 rounded-2xl p-4 text-center">
                                    <div className="text-xs font-black text-emerald-400 uppercase tracking-widest flex items-center justify-center gap-1.5">
                                        <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span> TOUR ĐANG DIỄN RA
                                    </div>
                                    <div className="text-xs text-gray-300 mt-1">Giải đấu đã chính thức khởi tranh</div>
                                </div>
                            </div>

                            <div className="bg-black/80 border border-gold/40 rounded-3xl p-5 shadow-2xl space-y-3">
                                <div className="flex justify-between items-center border-b border-gold/30 pb-2">
                                    <h3 className="font-black text-gold-bright tracking-wider text-sm uppercase flex items-center gap-2">
                                        <i className="fa-solid fa-trophy text-gold"></i> BẢNG XẾP HẠNG ELO HỘI VIÊN
                                    </h3>
                                    <span className="text-[10px] bg-amber-500/20 border border-amber-500/40 text-amber-300 font-bold px-2 py-0.5 rounded-full">TOP 10</span>
                                </div>

                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-xs">
                                        <thead>
                                            <tr className="border-b border-gray-800 text-gray-400 font-bold">
                                                <th className="p-2">HẠNG</th>
                                                <th className="p-2">TÊN HỘI VIÊN</th>
                                                <th className="p-2 text-right">THÁNG 11</th>
                                                <th className="p-2 text-right">QUÝ 4 (Q4)</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-gray-800/60 font-semibold">
                                            {mockLeaderboardData.map(item => (
                                                <tr key={item.rank} className="hover:bg-amber-500/10 transition">
                                                    <td className="p-2">
                                                        {item.rank === 1 ? '🥇 1' : (item.rank === 2 ? '🥈 2' : (item.rank === 3 ? '🥉 3' : item.rank))}
                                                    </td>
                                                    <td className="p-2 text-white font-bold">{item.name}</td>
                                                    <td className="p-2 text-right text-gold-bright">{item.monthElo.toLocaleString()}</td>
                                                    <td className="p-2 text-right text-amber-400">{item.quarterElo.toLocaleString()}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <div className="lg:col-span-5 flex flex-col justify-center">
                            <TournamentTVCard tour={activeTour} isPopoutWindow={false} />
                        </div>
                    </div>
                )}

                {activeView === 'tv-display' && (
                    <div className="w-full min-h-[85vh] flex items-center justify-center">
                        <TournamentTVCard tour={activeTour} isPopoutWindow={true} />
                    </div>
                )}

                {activeView === 'admin' && (
                    <div className="space-y-6 w-full">
                        <div className="bg-black/60 border border-gold/30 rounded-xl p-3 flex flex-wrap items-center justify-between gap-2 backdrop-blur-md">
                            <div className="flex items-center space-x-2 overflow-x-auto py-1">
                                <span className="text-xs text-gold-bright uppercase font-bold mr-1">Danh Sách Tour:</span>
                                {tournaments.map(t => (
                                    <div key={t.id} onClick={() => setSelectedTourId(t.id)} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-2 cursor-pointer select-none border ${selectedTourId === t.id ? 'bg-gradient-to-r from-amber-500 to-yellow-600 text-black border-gold shadow' : 'bg-gray-900/80 text-gray-300 border-gray-700'}`}>
                                        <span className={`w-2 h-2 rounded-full ${t.gameStats.isFinished ? 'bg-gray-500' : (t.gameStats.isPaused ? 'bg-red-500' : 'bg-emerald-400')}`}></span>
                                        <span>{t.config.name}</span>
                                        {tournaments.length > 1 && (
                                            <button type="button" onClick={(e) => { e.stopPropagation(); removeTournament(t.id); }} className="hover:bg-black/20 rounded px-1 text-xs font-black text-red-400">✕</button>
                                        )}
                                    </div>
                                ))}
                            </div>
                            <div className="flex items-center space-x-2">
                                <button onClick={addNewTournament} className="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow cursor-pointer transition">+ Tạo Tour Mới</button>
                            </div>
                        </div>

                        <div className="bg-black/70 border border-gold/40 rounded-2xl p-6 shadow-2xl backdrop-blur-md space-y-5">
                            <div className="flex justify-between items-center border-b border-gray-800 pb-3">
                                <div>
                                    <h2 className="text-lg font-bold text-gold-bright">Cấu Hình Tournament (Bản Nháp Setup):</h2>
                                    <div className="text-xs text-gray-400 font-semibold">{draftConfigState.config.name}</div>
                                </div>
                                <button onClick={applyDraftChangesToLive} className="px-5 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-extrabold text-xs shadow-lg cursor-pointer">✓ CẬP NHẬT HỆ THỐNG</button>
                            </div>

                            <div className="flex space-x-1 border-b border-gray-800 overflow-x-auto pb-2 text-xs font-bold">
                                {[
                                    { id: 1, label: '1. Basics' },
                                    { id: 2, label: '2. Blinds' },
                                    { id: 3, label: '3. Payouts' },
                                    { id: 4, label: '4. Màu & Font' },
                                    { id: 5, label: '5. Âm Thanh' },
                                    { id: 6, label: '6. Review' }
                                ].map(tab => (
                                    <button key={tab.id} onClick={() => setWizardStep(tab.id)} className={`px-4 py-2 rounded-lg transition cursor-pointer whitespace-nowrap ${wizardStep === tab.id ? 'bg-amber-500 text-black font-extrabold' : 'bg-gray-900 text-gray-400 hover:text-white'}`}>
                                        {tab.label}
                                    </button>
                                ))}
                            </div>

                            {wizardStep === 1 && (
                                <div className="space-y-4 text-xs sm:text-sm">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-gray-400 mb-1 font-semibold">Tên Câu Lạc Bộ (Club Name)</label>
                                            <input type="text" value={draftConfigState.config.clubName} onChange={(e) => updateDraftConfig('clubName', e.target.value)} className="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white font-bold" />
                                        </div>
                                        <div>
                                            <label className="block text-gray-400 mb-1 font-semibold">Tiêu Đề Phụ (Sub-Title CLB)</label>
                                            <input type="text" value={draftConfigState.config.subTitle} onChange={(e) => updateDraftConfig('subTitle', e.target.value)} className="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white font-bold" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-gray-400 mb-1 font-semibold">Tên Giải Đấu (Tournament Name)</label>
                                        <input type="text" value={draftConfigState.config.name} onChange={(e) => updateDraftConfig('name', e.target.value)} className="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white font-bold text-base" />
                                    </div>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                        <div>
                                            <label className="block text-gray-400 mb-1 font-semibold">Buy-in</label>
                                            <input type="number" value={draftConfigState.config.buyIn} onChange={(e) => updateDraftConfig('buyIn', Number(e.target.value))} className="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white font-bold" />
                                        </div>
                                        <div>
                                            <label className="block text-gray-400 mb-1 font-semibold">Rebuy Price</label>
                                            <input type="number" value={draftConfigState.config.rebuyPrice} onChange={(e) => updateDraftConfig('rebuyPrice', Number(e.target.value))} className="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white font-bold" />
                                        </div>
                                        <div>
                                            <label className="block text-gray-400 mb-1 font-semibold">Starting Stack</label>
                                            <input type="number" value={draftConfigState.config.startingStack} onChange={(e) => updateDraftConfig('startingStack', Number(e.target.value))} className="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white font-bold" />
                                        </div>
                                        <div>
                                            <label className="block text-gray-400 mb-1 font-semibold">Reg End Level</label>
                                            <input type="number" value={draftConfigState.config.regEndLevel} onChange={(e) => updateDraftConfig('regEndLevel', Number(e.target.value))} className="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-amber-400 font-bold" />
                                        </div>
                                    </div>
                                </div>
                            )}

                            {wizardStep === 2 && (
                                <div className="space-y-4">
                                    <div className="flex justify-between items-center">
                                        <h4 className="text-xs font-bold text-gray-300 uppercase">Cấu Trúc Blinds & Breaks (Kéo thả để sắp xếp)</h4>
                                        <div className="flex space-x-2">
                                            <button onClick={() => addBlindLevel('level')} className="px-3 py-1 bg-amber-600 hover:bg-amber-500 text-black text-xs font-extrabold rounded-lg">+ Level mới</button>
                                            <button onClick={() => addBlindLevel('break')} className="px-3 py-1 bg-sky-600 hover:bg-sky-500 text-white text-xs font-extrabold rounded-lg">+ Break mới</button>
                                        </div>
                                    </div>
                                    <div className="space-y-2 max-h-96 overflow-y-auto pr-1">
                                        {draftConfigState.blinds.map((item, idx) => (
                                            <div key={item.id || idx} draggable onDragStart={(e) => handleBlindDragStart(e, idx)} onDragOver={(e) => handleBlindDragOver(e, idx)} onDragEnd={handleBlindDragEnd} className={`p-3 rounded-xl border flex flex-wrap md:flex-nowrap items-center justify-between gap-2 cursor-grab active:cursor-grabbing ${item.type === 'break' ? 'bg-sky-950/40 border-sky-500/40' : 'bg-gray-900 border-gray-800'}`}>
                                                <div className="flex items-center space-x-2 w-full md:w-auto">
                                                    <i className="fa-solid fa-grip-vertical text-gray-600"></i>
                                                    <span className="font-extrabold text-xs w-16">{item.type === 'break' ? 'BREAK' : `Lvl ${idx + 1}`}</span>
                                                </div>
                                                {item.type === 'level' ? (
                                                    <div className="grid grid-cols-4 gap-2 flex-1 text-xs">
                                                        <input type="number" value={item.sb} onChange={(e) => handleBlindFieldChange(idx, 'sb', Number(e.target.value))} placeholder="SB" className="bg-black/60 border border-gray-700 rounded px-2 py-1 text-white text-center font-bold" />
                                                        <input type="number" value={item.bb} onChange={(e) => handleBlindFieldChange(idx, 'bb', Number(e.target.value))} placeholder="BB" className="bg-black/60 border border-gray-700 rounded px-2 py-1 text-white text-center font-bold" />
                                                        <input type="number" value={item.ante} onChange={(e) => handleBlindFieldChange(idx, 'ante', Number(e.target.value))} placeholder="Ante" className="bg-black/60 border border-gray-700 rounded px-2 py-1 text-white text-center font-bold" />
                                                        <input type="number" value={item.length} onChange={(e) => handleBlindFieldChange(idx, 'length', Number(e.target.value))} placeholder="Phút" className="bg-black/60 border border-gray-700 rounded px-2 py-1 text-amber-400 text-center font-bold" />
                                                    </div>
                                                ) : (
                                                    <div className="grid grid-cols-3 gap-2 flex-1 text-xs">
                                                        <input type="text" value={item.title || ''} onChange={(e) => handleBlindFieldChange(idx, 'title', e.target.value)} placeholder="Tên Break" className="bg-black/60 border border-gray-700 rounded px-2 py-1 text-white font-bold" />
                                                        <input type="number" value={item.length} onChange={(e) => handleBlindFieldChange(idx, 'length', Number(e.target.value))} placeholder="Thời gian (Phút)" className="bg-black/60 border border-gray-700 rounded px-2 py-1 text-amber-400 text-center font-bold" />
                                                        <input type="text" value={item.chipRaceTitle || ''} onChange={(e) => handleBlindFieldChange(idx, 'chipRaceTitle', e.target.value)} placeholder="Chip Race Info" className="bg-black/60 border border-gray-700 rounded px-2 py-1 text-white" />
                                                    </div>
                                                )}
                                                <button onClick={() => removeBlindItem(idx)} className="text-red-400 hover:text-red-300 font-bold px-2 py-1 text-xs">✕</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {wizardStep === 3 && (
                                <div className="space-y-4">
                                    <div className="flex justify-between items-center">
                                        <h4 className="text-xs font-bold text-gray-300 uppercase">Cơ Cấu Giải Thưởng (Payouts)</h4>
                                        <button onClick={addPayoutRow} className="px-3 py-1 bg-amber-600 hover:bg-amber-500 text-black text-xs font-extrabold rounded-lg">+ Thêm giải</button>
                                    </div>
                                    <div className="space-y-2">
                                        {draftConfigState.payouts.map((p, idx) => (
                                            <div key={idx} className="flex items-center space-x-3 bg-gray-900 p-2.5 rounded-xl border border-gray-800">
                                                <input type="text" value={p.place} onChange={(e) => handlePayoutChange(idx, 'place', e.target.value)} className="bg-black/60 border border-gray-700 rounded p-2 text-white text-xs font-bold w-1/3" />
                                                <input type="number" value={p.value} onChange={(e) => handlePayoutChange(idx, 'value', Number(e.target.value))} className="bg-black/60 border border-gray-700 rounded p-2 text-gold-bright text-xs font-extrabold w-1/2" />
                                                <button onClick={() => removePayoutRow(idx)} className="text-red-400 hover:text-red-300 font-bold px-2">✕</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {wizardStep === 4 && (
                                <div className="space-y-4 text-xs sm:text-sm">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-gray-400 mb-1 font-semibold">Bộ Chữ (Font Style)</label>
                                            <select value={draftConfigState.config.selectedFont || 'font-montserrat'} onChange={(e) => updateDraftConfig('selectedFont', e.target.value)} className="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white font-bold">
                                                {fontOptions.map(f => (
                                                    <option key={f.value} value={f.value}>{f.label}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-gray-400 mb-1 font-semibold">Tông Màu (Color Theme)</label>
                                            <select value={draftConfigState.config.colorTheme || 'tnt-gold'} onChange={(e) => updateDraftConfig('colorTheme', e.target.value)} className="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white font-bold">
                                                {colorThemes.map(t => (
                                                    <option key={t.id} value={t.id}>{t.label}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    <div className="border border-gray-800 rounded-xl p-3 bg-black/40 space-y-3">
                                        <button onClick={() => setShowFontSizesCollapse(!showFontSizesCollapse)} className="flex justify-between items-center w-full text-xs font-bold text-gold-bright uppercase">
                                            <span>Tùy chỉnh Kích Thước Font TV (PX)</span>
                                            <span>{showFontSizesCollapse ? '▲ Thu gọn' : '▼ Mở rộng'}</span>
                                        </button>

                                        {showFontSizesCollapse && (
                                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3 pt-2 border-t border-gray-800">
                                                {[
                                                    { key: 'brandPx', label: 'Tên CLB' },
                                                    { key: 'headerPx', label: 'Tên Tour' },
                                                    { key: 'timerPx', label: 'Đồng Hồ' },
                                                    { key: 'blindsPx', label: 'Blinds' },
                                                    { key: 'nextLevelPx', label: 'Next Level' },
                                                    { key: 'statsPx', label: 'Thống Kê' },
                                                    { key: 'payoutsPx', label: 'Prize Pool' },
                                                    { key: 'levelBadgePx', label: 'Badge Level' },
                                                    { key: 'infoRowPx', label: 'Hàng Buyin' }
                                                ].map(item => (
                                                    <div key={item.key}>
                                                        <label className="block text-[11px] text-gray-400 mb-0.5">{item.label}</label>
                                                        <input type="number" value={(draftConfigState.config.fontCustomSizes || {})[item.key] || 30} onChange={(e) => updateDraftFontSize(item.key, e.target.value)} className="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white font-bold text-xs" />
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {wizardStep === 5 && (
                                <div className="space-y-4 text-xs sm:text-sm">
                                    <h4 className="text-xs font-bold text-gray-300 uppercase mb-2">Cấu Hình Âm Thanh Thông Báo</h4>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {[
                                            { key: 'nextLevel', label: 'Âm thanh Chuyển Level' },
                                            { key: 'breakStart', label: 'Âm thanh Bắt đầu Break' },
                                            { key: 'breakEnd', label: 'Âm thanh Kết thúc Break' },
                                            { key: 'warning10s', label: 'Âm thanh Cảnh báo 10s' }
                                        ].map(s => (
                                            <div key={s.key} className="bg-gray-900 p-3 rounded-xl border border-gray-800 space-y-2">
                                                <label className="block text-gray-300 font-bold">{s.label}</label>
                                                <div className="flex gap-2">
                                                    <select value={(draftConfigState.soundsConfig || {})[s.key] || 'Boxing Bell'} onChange={(e) => setDraftConfigState(prev => ({ ...prev, soundsConfig: { ...(prev.soundsConfig || {}), [s.key]: e.target.value } }))} className="flex-1 bg-black/60 border border-gray-700 rounded p-2 text-white font-semibold text-xs">
                                                        <option value="Boxing Bell">Boxing Bell</option>
                                                        <option value="Chime Bell">Chime Bell</option>
                                                        <option value="Digital Beep">Digital Beep</option>
                                                        <option value="Whistle">Whistle</option>
                                                    </select>
                                                    <button onClick={() => playSoundEffect((draftConfigState.soundsConfig || {})[s.key] || 'Boxing Bell')} className="px-3 py-1 bg-amber-500 text-black font-bold rounded text-xs">Thử</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {wizardStep === 6 && (
                                <div className="space-y-4 text-xs sm:text-sm">
                                    <div className="bg-black/60 p-4 rounded-xl border border-gold/30 space-y-2">
                                        <div className="font-bold text-gold-bright text-base">Tổng Quan Cấu Hình: {draftConfigState.config.name}</div>
                                        <div>Tên CLB: <span className="text-white font-bold">{draftConfigState.config.clubName}</span></div>
                                        <div>Buy-in / Rebuy: <span className="text-white font-bold">{draftConfigState.config.buyIn} / {draftConfigState.config.rebuyPrice}</span></div>
                                        <div>Số cấp Blinds: <span className="text-amber-400 font-bold">{draftConfigState.blinds.length} Level</span></div>
                                    </div>
                                    <button onClick={applyDraftChangesToLive} className="w-full py-3 bg-gradient-to-r from-amber-500 to-yellow-600 text-black font-extrabold text-sm rounded-xl shadow-lg cursor-pointer">CẬP NHẬT LÊN HỆ THỐNG CLOUD</button>
                                </div>
                            )}
                        </div>

                        <div className="bg-black/70 border border-gold/40 rounded-2xl p-5 shadow-2xl backdrop-blur-md space-y-4">
                            <div className="flex flex-wrap justify-between items-center border-b border-gray-800 pb-3 gap-2">
                                <h3 className="text-sm font-bold text-gold-bright uppercase">Điều Khiển Trực Tiếp: <span className="text-white">{activeTour.config.name}</span></h3>
                                <div className="flex flex-wrap items-center gap-2">
                                    <button onClick={() => togglePauseTour(activeTour.id)} className={`px-5 py-1.5 rounded text-xs font-black shadow transition cursor-pointer ${activeTour.gameStats.isPaused ? 'bg-emerald-600 hover:bg-emerald-500 text-white' : 'bg-amber-600 hover:bg-amber-500 text-white'}`}>
                                        {activeTour.gameStats.isPaused ? '▶ START / RESUME' : '⏸ PAUSE'}
                                    </button>
                                    <button onClick={() => finishTour(activeTour.id)} className="px-4 py-1.5 rounded bg-red-900/80 hover:bg-red-800 text-red-200 border border-red-600/50 text-xs font-bold transition cursor-pointer">🏁 KẾT THÚC</button>
                                </div>
                            </div>
                            <div className="grid grid-cols-3 gap-3">
                                {[
                                    { label: 'Buy-ins', field: 'buyIns' },
                                    { label: 'Eliminated', field: 'eliminated' },
                                    { label: 'Re-buys', field: 'rebuys' }
                                ].map(({ label, field }) => (
                                    <div key={field} className="bg-black/50 p-3 rounded-xl border border-gray-800 text-center">
                                        <div className="text-xs text-gray-400 uppercase font-bold mb-1">{label}</div>
                                        <div className="text-2xl font-black text-gold-bright my-1">{activeTour.gameStats[field]}</div>
                                        <div className="flex justify-center space-x-2 mt-2">
                                            <button onClick={() => handleStatChange(field, -1)} className="w-8 h-8 bg-gray-800 hover:bg-gray-700 rounded-lg font-extrabold text-white cursor-pointer">-</button>
                                            <button onClick={() => handleStatChange(field, 1)} className="w-8 h-8 bg-amber-500 hover:bg-amber-400 rounded-lg font-extrabold text-black cursor-pointer">+</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                )}
            </main>
        </div>
    );
}

ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
