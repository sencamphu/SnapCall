    <!-- Supabase SDK Realtime Integration -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://mkizhwumwxfqlwwfoief.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_XL_p7DDfizVqdz_mETXztw_7MecHfiQ";

        window.initCloudSync = async function(onDataReceived, onSyncStatusChange) {
            if (!SUPABASE_URL || !SUPABASE_ANON_KEY || !window.supabase) {
                console.warn("Supabase SDK chưa sẵn sàng.");
                onSyncStatusChange(false);
                return;
            }

            try {
                const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                onSyncStatusChange(true);

                // Nạp dữ liệu ban đầu từ Supabase
                const fetchData = async () => {
                    const { data, error } = await supabaseClient
                        .from('tournaments')
                        .select('data')
                        .eq('id', 'live_state')
                        .maybeSingle();

                    if (data && data.data) {
                        onDataReceived(data.data);
                    }
                };
                fetchData();

                // Đăng ký kênh Realtime Broadcast + Postgres Changes
                const channel = supabaseClient
                    .channel('room_poker_live', { config: { broadcast: { self: false } } })
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'tournaments' }, payload => {
                        if (payload.new && payload.new.data) {
                            onDataReceived(payload.new.data);
                        }
                    })
                    .on('broadcast', { event: 'tour_update' }, payload => {
                        if (payload.payload && payload.payload.data) {
                            onDataReceived(payload.payload.data);
                        }
                    })
                    .subscribe();

                // Hàm lưu dữ liệu lên Cloud & truyền tin tức thì
                window.saveTournamentsToCloud = async (toursData) => {
                    try {
                        // Phát broadcast tức thì cho thiết bị đang xem
                        channel.send({
                            type: 'broadcast',
                            event: 'tour_update',
                            payload: { data: toursData }
                        });

                        // Ghi dữ liệu vào database Supabase
                        await supabaseClient
                            .from('tournaments')
                            .upsert({ id: 'live_state', data: toursData, updated_at: new Date() });
                    } catch (e) {
                        console.warn("Lỗi lưu Supabase Cloud:", e);
                    }
                };
            } catch (err) {
                console.warn("Lỗi kết nối Supabase Cloud Sync:", err);
                onSyncStatusChange(false);
            }
        };
    </script>

    <script type="text/babel">

const defaultBlinds = [

    { id: 2, type: 'level', sb: 100, bb: 200, ante: 200, length: 17 },

    { id: 5, type: 'level', sb: 300, bb: 600, ante: 600, length: 17 },
    { id: 6, type: 'level', sb: 400, bb: 800, ante: 800, length: 17 },
    { id: 7, type: 'level', sb: 500, bb: 1000, ante: 1000, length: 17 }

const defaultTourTemplate = (name, id, buyIn, rebuyPrice) => ({
    id: id,
    config: {
        clubName: 'SNAP CALL',
        subTitle: 'BOARD GAME & COFFEE',
        name: name,
        buyIn: buyIn,
        currency: 'TOKEN',
        fee: 0,
        startingStack: 25000,

        logoPosition: 'Center',
        logoSizePx: 80,

        selectedFont: 'font-montserrat',
        colorTheme: 'tnt-gold',
        fontCustomSizes: {

    payoutMode: 'fixed',
    payouts: [
        { place: 'Top 1', value: 10 },
        { place: 'Top 2', value: 6.5 },
        { place: 'Top 3', value: 4.5 },
        { place: 'Top 4', value: 3 },
        { place: 'Top 5', value: 2 }
    ],
    soundsConfig: {
        nextLevel: 'Boxing Bell',
        breakStart: 'Whistle',
        breakEnd: 'Chime Bell',
        warning10s: 'Digital Beep'
    },
    gameStats: {
        buyIns: 10,
        eliminated: 0,
        rebuys: 8,
        currentStepIdx: 0,
        secondsLeft: 1020,
        targetEndTime: null,
        isPaused: true
    }
});

function TournamentTVCard({ tour, openSinglePopout, isPopoutWindow }) {
    const currentStep = tour.blinds[tour.gameStats.currentStepIdx] || tour.blinds[0];

    const getCalculatedLevelNumber = (blindsList, stepIndex) => {
        let levelNum = 0;
        for (let i = 0; i <= stepIndex && i < blindsList.length; i++) {
            if (blindsList[i].type === 'level') levelNum++;
        }
        return levelNum;
    };

    const getSecondsToNextBreak = (t) => {
        let totalSecs = t.gameStats.secondsLeft;
        for (let i = t.gameStats.currentStepIdx + 1; i < t.blinds.length; i++) {
            if (t.blinds[i].type === 'break') break;
            totalSecs += t.blinds[i].length * 60;
        }
        return totalSecs;
    };

    const getNextLevelInfo = (t) => {
        for (let i = t.gameStats.currentStepIdx + 1; i < t.blinds.length; i++) {
            if (t.blinds[i].type === 'level') {
                return `${t.blinds[i].sb.toLocaleString()}/${t.blinds[i].bb.toLocaleString()}`;
            } else if (t.blinds[i].type === 'break') {
                return 'Break Time';
            }
        }
        return 'MAX LEVEL REACHED';
    };

    const formatTime = (totalSeconds) => {
        const mins = Math.floor(Math.max(0, totalSeconds) / 60);
        const secs = Math.floor(Math.max(0, totalSeconds) % 60);
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    };

    const formatTimeHHMMSS = (totalSeconds) => {
        const hrs = Math.floor(totalSeconds / 3600);
        const mins = Math.floor((totalSeconds % 3600) / 60);
        const secs = Math.floor(totalSeconds % 60);
        return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    };

    const currentLevelNum = getCalculatedLevelNumber(tour.blinds, tour.gameStats.currentStepIdx);
    const totalEntries = tour.gameStats.buyIns + tour.gameStats.rebuys;
    const totalPointsFromPayouts = tour.payouts.reduce((sum, p) => sum + (Number(p.value) || 0), 0);
    const totalChipsInPlay = totalEntries * tour.config.startingStack;
    const playersLeft = Math.max(0, tour.gameStats.buyIns - tour.gameStats.eliminated);
    const avgStack = playersLeft > 0 ? Math.round(totalChipsInPlay / playersLeft) : 0;
    const nextBreakTime = formatTimeHHMMSS(getSecondsToNextBreak(tour));
    
    const fontSizes = tour.config.fontCustomSizes || { brandPx: 20, headerPx: 36, subHeaderPx: 18, timerPx: 108, blindsPx: 28, nextLevelPx: 16, statsPx: 18, payoutsPx: 18, levelBadgePx: 22 };
    const themeStyle = getThemeStyles(tour.config.colorTheme);
    const selectedFontClass = tour.config.selectedFont || 'font-montserrat';
    const logoSize = tour.config.logoSizePx || 80;
    const qrSize = tour.config.qrSizePx || 70;
    const isLogoCenter = (tour.config.logoPosition || 'Center') === 'Center';

    return (
        <div 
            className={`w-full gold-border-box rounded-3xl bg-black/85 backdrop-blur-md p-4 sm:p-5 md:p-6 relative overflow-hidden shadow-2xl flex flex-col justify-between ${selectedFontClass} ${isPopoutWindow ? 'h-full min-h-screen' : 'min-h-[85vh]'} my-auto`}
            style={{
                backgroundImage: tour.config.bgImageUrl ? `url(${tour.config.bgImageUrl})` : 'none',
                backgroundSize: 'cover',
                backgroundPosition: 'center'
            }}
        >
            {openSinglePopout && (
                <button 
                    onClick={() => openSinglePopout(tour.id)}
                    className="absolute top-3 right-3 z-30 bg-sky-700/80 hover:bg-sky-600 text-white font-bold px-2.5 py-1 rounded-lg border border-sky-400/50 text-xs shadow transition flex items-center gap-1 cursor-pointer"
                    title="Mở riêng giải đấu này ra cửa sổ TV mới"
                >
                    <i className="fa-solid fa-up-right-from-square"></i> Popout
                </button>
            )}

            {!isLogoCenter && tour.config.logoUrl && (
                <div className="absolute top-3 left-3 z-20">
                    <img src={tour.config.logoUrl} alt="Club Logo" style={{ height: `${logoSize}px` }} className="object-contain drop-shadow-md" />
                </div>
            )}

            {/* RESPONSIVE LAYOUT: STACK ON MOBILE, STRICT 3-COLUMN ON DESKTOP/TV (MD+) */}
            <div className="flex flex-col md:grid md:grid-cols-12 gap-4 md:gap-2 items-center flex-1 w-full my-auto">
                
                {/* CENTER COLUMN: TIMER & LEVEL INFO */}
                <div className="w-full md:col-span-6 md:order-2 text-center space-y-1.5 sm:space-y-2 my-auto px-1">
                    <div className="text-center mb-1">
                        {isLogoCenter && (
                            <div className="flex flex-col items-center justify-center mb-1">
                                {tour.config.logoUrl ? (
                                    <img src={tour.config.logoUrl} alt="Club Logo" style={{ height: `${logoSize}px` }} className="object-contain drop-shadow-lg mb-1" />
                                ) : (
                                    <div className="flex flex-col items-center">
                                        <div className="text-gold font-extrabold tracking-[0.2em] font-cinzel text-center" style={{ fontSize: `${fontSizes.brandPx || 20}px` }}>
                                            {tour.config.clubName}
                                        </div>
                                        <div className="text-[9px] text-gold/70 tracking-[0.25em] font-semibold uppercase border-t border-b border-gold/30 px-2 py-0.5 mt-0.5">
                                            — {tour.config.subTitle || 'BOARD GAME & COFFEE'} —
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        <div className="font-black uppercase tracking-wider mb-1 font-cinzel text-center leading-tight" style={{ fontSize: `${fontSizes.headerPx || 36}px`, color: themeStyle.headerColor }}>
                            {tour.config.name}
                        </div>
                        
                        <div className="flex flex-wrap justify-center items-center gap-x-2 sm:gap-x-4 text-gray-200 font-medium tracking-wide" style={{ fontSize: `${fontSizes.subHeaderPx || 18}px` }}>
                            <div>Buyin: <span className="text-white font-bold">{tour.config.buyIn}</span></div>
                            <div>Rebuy: <span className="text-white font-bold">{tour.config.rebuyPrice}</span></div>
                            <div>Stack: <span className="text-white font-bold">{tour.config.startingStack.toLocaleString()}</span></div>
                            <div>Reg End: <span className="text-white font-bold">Level {tour.config.regEndLevel}</span></div>
                        </div>
                    </div>

                    {/* LEVEL TITLE BADGE */}
                    <div className="inline-block border border-gold/40 rounded-xl px-3 sm:px-5 py-0.5 bg-black/50 max-w-full">
                        <span className="font-bold text-gray-200 tracking-widest uppercase block text-center" style={{ fontSize: `${fontSizes.levelBadgePx || 22}px` }}>
                            {currentStep.type === 'break' 
                                ? `BREAK TIME ${currentStep.title ? `(${currentStep.title})` : ''} ${currentStep.isChipRace ? '- CHIP RACE' : ''}` 
                                : `LEVEL ${currentLevelNum}`}
                        </span>
                    </div>

                    {/* COUNTDOWN TIMER */}
                    <div className="py-1 flex justify-center items-center">
                        {tour.gameStats.isPaused ? (
                            <div className="font-timer font-black tracking-wider leading-none text-red-500 animate-pause-pulse drop-shadow-lg" style={{ fontSize: `${fontSizes.timerPx || 108}px` }}>
                                PAUSED
                            </div>
                        ) : (
                            <div className="font-timer font-black tracking-wider leading-none" style={{ fontSize: `${fontSizes.timerPx || 108}px`, color: themeStyle.timerColor, textShadow: themeStyle.timerGlow }}>
                                {formatTime(tour.gameStats.secondsLeft)}
                            </div>

                    </div>

                    {/* BLINDS & ANTE */}
                    <div className="font-bold tracking-wider" style={{ fontSize: `${fontSizes.blindsPx || 28}px`, color: themeStyle.blindsColor }}>
                        {currentStep.type === 'break' ? (currentStep.isChipRace ? `CHIP RACE: ${currentStep.chipRaceTitle || 'REMOVE LOW CHIPS'}` : 'BREAK TIME') : `BLINDS : ${currentStep.sb.toLocaleString()} / ${currentStep.bb.toLocaleString()}`}
                    </div>

                    <div className="font-bold tracking-wider" style={{ fontSize: `${Math.max(14, (fontSizes.blindsPx || 28) - 4)}px`, color: themeStyle.blindsColor }}>
                        {currentStep.type === 'break' ? (currentStep.isChipRace && currentStep.chipRaceTitle ? `RACE CHIPS: ${currentStep.chipRaceTitle}` : '') : `ANTE : ${currentStep.ante.toLocaleString()}`}
                    </div>

                    <div className="w-full max-w-xs mx-auto border-b border-gold/30 my-1"></div>

                    <div className="text-gray-300 font-medium" style={{ fontSize: `${fontSizes.nextLevelPx || 16}px` }}>
                        Next: <span className="text-white font-semibold">{getNextLevelInfo(tour)}</span>
                    </div>
                </div>

                {/* LEFT COLUMN: PLAYERS & STATS */}

                    <div>
                        <div className="text-gray-400 font-bold tracking-wider uppercase mb-0.5" style={{ fontSize: `${Math.max(9, (fontSizes.statsPx || 18) - 7)}px` }}>PLAYERS</div>
                        <div className="text-white font-black" style={{ fontSize: `${fontSizes.statsPx || 18}px` }}>{playersLeft} / {tour.gameStats.buyIns}</div>
                    </div>

                    <div>
                        <div className="text-gray-400 font-bold tracking-wider uppercase mb-0.5" style={{ fontSize: `${Math.max(9, (fontSizes.statsPx || 18) - 7)}px` }}>RE-BUY</div>
                        <div className="text-white font-black" style={{ fontSize: `${fontSizes.statsPx || 18}px` }}>{tour.gameStats.rebuys}</div>
                    </div>

                    <div>
                        <div className="text-gray-400 font-bold tracking-wider uppercase mb-0.5" style={{ fontSize: `${Math.max(9, (fontSizes.statsPx || 18) - 7)}px` }}>TOTAL ENTRIES</div>
                        <div className="text-white font-black" style={{ fontSize: `${fontSizes.statsPx || 18}px` }}>{totalEntries}</div>
                    </div>

                    <div>
                        <div className="text-gray-400 font-bold tracking-wider uppercase mb-0.5" style={{ fontSize: `${Math.max(9, (fontSizes.statsPx || 18) - 7)}px` }}>TOTAL STACK</div>
                        <div className="text-white font-black" style={{ fontSize: `${fontSizes.statsPx || 18}px` }}>{totalChipsInPlay.toLocaleString()}</div>
                    </div>

                    <div>
                        <div className="text-gray-400 font-bold tracking-wider uppercase mb-0.5" style={{ fontSize: `${Math.max(9, (fontSizes.statsPx || 18) - 7)}px` }}>AVG STACK</div>
                        <div className="text-white font-black" style={{ fontSize: `${fontSizes.statsPx || 18}px` }}>{avgStack.toLocaleString()}</div>
                    </div>

                    <div className="md:pt-1.5 md:border-t border-gray-800">
                        <div className="text-gray-400 font-bold tracking-wider uppercase mb-0.5" style={{ fontSize: `${Math.max(9, (fontSizes.statsPx || 18) - 7)}px` }}>NEXT BREAK</div>
                        <div className="text-white font-black" style={{ fontSize: `${fontSizes.statsPx || 18}px` }}>{nextBreakTime}</div>
                    </div>
                </div>

                {/* RIGHT COLUMN: PRIZE POOL & PAYOUTS */}
                <div className="w-full md:col-span-3 md:order-3 text-right flex flex-col justify-center h-full border-t md:border-t-0 border-gold/20 pt-3 md:pt-0 my-auto">
                    <div className="w-full text-center md:text-right my-auto">
                        <div className="text-gray-400 font-semibold tracking-widest uppercase mb-1" style={{ fontSize: `${Math.max(9, (fontSizes.payoutsPx || 18) - 7)}px` }}>PRIZE POOL</div>
                        
                        <div className="font-black text-gold-bright tracking-tight mb-2 sm:mb-3" style={{ fontSize: `${(fontSizes.payoutsPx || 18) + 14}px` }}>
                            {totalPointsFromPayouts.toLocaleString()} TOKEN
                        </div>

                        <div className="space-y-1.5 text-left border-t border-gray-800/80 pt-2.5 max-w-xs ml-auto" style={{ fontSize: `${fontSizes.payoutsPx || 18}px` }}>
                            {tour.payouts.map((p, idx) => (
                                <div key={idx} className="flex justify-between items-center font-bold px-1">
                                    <span className="text-gray-300">{p.place}</span>
                                    <span className="text-white">{p.value}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    {tour.config.qrCodeUrl && (
                        <div className="mt-2 pt-1 border-t border-gray-800/80 flex justify-end items-center gap-2">
                            <div className="text-right">
                                <div className="text-[9px] font-bold uppercase" style={{ color: themeStyle.blindsColor }}>Quét QR</div>
                                <div className="text-[8px] text-gray-400">Đăng ký & thông tin</div>
                            </div>
                            <img src={tour.config.qrCodeUrl} alt="QR Code" style={{ height: `${qrSize}px`, width: `${qrSize}px` }} className="object-contain rounded border border-gold/40 p-0.5 bg-black/60" />
                        </div>
                    )}
                </div>
            </div>

            {/* WATERMARK FOOTER */}
            <div className="mt-3 pt-2 border-t border-gray-800/80 flex justify-between items-center text-[10px] text-gray-500 font-medium">
                <div>SNAP CALL • BOARD GAME & COFFEE • EST. 2026</div>
                <div>Powered by Snap Call</div>
            </div>
        </div>
    );
}

function App() {
    const [activeView, setActiveView] = useState('player-tv');
    const [wizardStep, setWizardStep] = useState(1);
    const [isCloudSynced, setIsCloudSynced] = useState(false);

    const [tournaments, setTournaments] = useState(() => {
        const saved = localStorage.getItem('poker_tournaments_live_v6');
        if (saved) {
            try { return JSON.parse(saved); } catch(e) {}
        }
        return [
            defaultTourTemplate('SUPER HIGH ROLLER', 1, 130, 130),
            defaultTourTemplate('TURBO CHAMPIONSHIP', 2, 100, 100)
        ];
    });

    const [selectedTourId, setSelectedTourId] = useState(1);

    const activeTour = tournaments.find(t => t.id === selectedTourId) || tournaments[0];

    useEffect(() => {
        if (window.initCloudSync) {
            window.initCloudSync(
                (cloudTours) => {
                    if (cloudTours && Array.isArray(cloudTours) && cloudTours.length > 0) {
                        setTournaments(cloudTours);
                    }
                },
                (status) => setIsCloudSynced(status)
            );
        }
    }, []);

    useEffect(() => {
        try {
            localStorage.setItem('poker_tournaments_live_v6', JSON.stringify(tournaments));
            if (window.saveTournamentsToCloud) {
                window.saveTournamentsToCloud(tournaments);
            }
        } catch(e) {
            console.warn("Storage quota limit:", e);
        }
    }, [tournaments]);

    const playSoundEffect = (soundType) => {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const now = ctx.currentTime;

            if (soundType === 'Boxing Bell') {
                [0, 0.15].forEach(delay => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1200, now + delay);
                    gain.gain.setValueAtTime(0.5, now + delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.8);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + delay);
                    osc.stop(now + delay + 0.8);
                });
            } else if (soundType === 'Chime Bell') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 1.2);
            } else if (soundType === 'Digital Beep') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(1500, now);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (soundType === 'Whistle') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(2400, now);
                osc.frequency.exponentialRampToValueAtTime(2800, now + 0.3);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        } catch (e) {
            console.log("Audio play error:", e);
        }
    };

    // TIMESTAMP TARGET-BASED TIMER ACCURATE ENGINE
    useEffect(() => {
        const timer = setInterval(() => {
            const now = Date.now();
            setTournaments(prevTours => prevTours.map(tour => {
                if (tour.gameStats.isPaused) {
                    return tour;
                }

                if (!tour.gameStats.targetEndTime) {
                    return {
                        ...tour,
                        gameStats: {
                            ...tour.gameStats,
                            targetEndTime: now + (tour.gameStats.secondsLeft * 1000)
                        }
                    };
                }

                const remainingSecs = Math.max(0, Math.ceil((tour.gameStats.targetEndTime - now) / 1000));

                if (remainingSecs > 0) {
                    return {
                        ...tour,
                        gameStats: { ...tour.gameStats, secondsLeft: remainingSecs }
                    };
                } else {
                    const currentItem = tour.blinds[tour.gameStats.currentStepIdx];
                    if (currentItem && currentItem.type === 'break') {
                        playSoundEffect(tour.soundsConfig.breakEnd || 'Chime Bell');
                    } else {
                        playSoundEffect(tour.soundsConfig.nextLevel || 'Boxing Bell');
                    }

                    const nextIdx = tour.gameStats.currentStepIdx + 1;
                    if (nextIdx < tour.blinds.length) {
                        const nextStep = tour.blinds[nextIdx];
                        const nextLengthSecs = (nextStep.length || 15) * 60;
                        return {
                            ...tour,
                            gameStats: {
                                ...tour.gameStats,
                                currentStepIdx: nextIdx,
                                secondsLeft: nextLengthSecs,
                                targetEndTime: now + (nextLengthSecs * 1000)
                            }
                        };
                    } else {
                        return {
                            ...tour,
                            gameStats: { ...tour.gameStats, secondsLeft: 0, targetEndTime: null, isPaused: true }
                        };
                    }
                }
            }));
        }, 300);
        return () => clearInterval(timer);
    }, []);

    const updateActiveTour = (field, value) => {
        setTournaments(prev => prev.map(t => t.id === selectedTourId ? { ...t, [field]: value } : t));
    };

    const updateActiveConfig = (field, value) => {
        setTournaments(prev => prev.map(t => {
            if (t.id === selectedTourId) {
                return { ...t, config: { ...t.config, [field]: value } };
            }
            return t;
        }));
    };

    const handleFileUpload = (e, configField) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 800;

                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.75);
                    updateActiveConfig(configField, compressedBase64);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    };

    const handleStatChange = (field, delta) => {
        setTournaments(prev => prev.map(t => {
            if (t.id === selectedTourId) {
                return {
                    ...t,
                    gameStats: {
                        ...t.gameStats,
                        [field]: Math.max(0, t.gameStats[field] + delta)
                    }
                };
            }
            return t;
        }));
    };

    const togglePauseTour = (tourId) => {
        const now = Date.now();
        setTournaments(prev => prev.map(t => {
            if (t.id === tourId) {
                const willPause = !t.gameStats.isPaused;
                if (willPause) {
                    return {
                        ...t,
                        gameStats: {
                            ...t.gameStats,
                            isPaused: true,
                            targetEndTime: null
                        }
                    };
                } else {
                    return {
                        ...t,
                        gameStats: {
                            ...t.gameStats,
                            isPaused: false,
                            targetEndTime: now + (t.gameStats.secondsLeft * 1000)
                        }
                    };
                }
            }
            return t;
        }));
    };

    const adjustTimerSeconds = (tourId, deltaSeconds) => {
        const now = Date.now();
        setTournaments(prev => prev.map(t => {
            if (t.id === tourId) {
                const newSecs = Math.max(0, t.gameStats.secondsLeft + deltaSeconds);
                return {
                    ...t,
                    gameStats: {
                        ...t.gameStats,
                        secondsLeft: newSecs,
                        targetEndTime: t.gameStats.isPaused ? null : now + (newSecs * 1000)

            }
            return t;
        }));

                    return defaultTourTemplate(t.config.name, t.id, t.config.buyIn, t.config.rebuyPrice);
                }
                return t;
            }));
        }
    };

    const addNewTournament = () => {
        const newId = Date.now();
        const newTour = defaultTourTemplate(`TOUR #${tournaments.length + 1}`, newId, 100, 100);
        setTournaments(prev => [...prev, newTour]);
        setSelectedTourId(newId);

    const removeTournament = (tourId) => {

        }

    const saveSingleTourToFile = () => {

    const loadSingleTourFromFile = (e) => {

            }

            const targetTour = currentTours.find(t => t.id === targetTourId) || currentTours[0];

            ReactDOM.render(
                <div className="w-full h-full flex flex-col justify-center items-center">
                    <TournamentTVCard tour={targetTour} isPopoutWindow={true} />

            );
        };

        renderPopoutContainer();
        const interval = setInterval(() => {
            if (popoutWindow.closed) {
                clearInterval(interval);
            } else {
                renderPopoutContainer();
            }
        }, 300);
    };

    const addBlindLevel = (type) => {
        const newBlinds = [...activeTour.blinds, type === 'level' ? { id: Date.now(), type: 'level', sb: 500, bb: 1000, ante: 1000, length: 15 } : { id: Date.now(), type: 'break', length: 10, title: 'Break', isChipRace: false, chipRaceTitle: '' }];
        updateActiveTour('blinds', newBlinds);
    };

    const removeBlind = (id) => {
        const newBlinds = activeTour.blinds.filter(b => b.id !== id);
        updateActiveTour('blinds', newBlinds);
    };

    const moveBlindItem = (index, direction) => {
        const newBlinds = [...activeTour.blinds];
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= newBlinds.length) return;
        const temp = newBlinds[index];
        newBlinds[index] = newBlinds[targetIndex];
        newBlinds[targetIndex] = temp;
        updateActiveTour('blinds', newBlinds);
    };

    const updateBlindField = (bId, field, val) => {
        const newBlinds = activeTour.blinds.map(item => {
            if (item.id === bId) {
                return { ...item, [field]: val };
            }
            return item;
        });
        
        const now = Date.now();
        setTournaments(prev => prev.map(t => {
            if (t.id === selectedTourId) {
                const isCurrentStep = t.blinds[t.gameStats.currentStepIdx]?.id === bId;
                const newSecs = (isCurrentStep && field === 'length') ? val * 60 : t.gameStats.secondsLeft;
                return {
                    ...t,
                    blinds: newBlinds,
                    gameStats: {
                        ...t.gameStats,
                        secondsLeft: newSecs,
                        targetEndTime: t.gameStats.isPaused ? null : now + (newSecs * 1000)
                    }
                };
            }
            return t;
        }));
    };

    const addPayoutItem = () => {
        const nextPlaceNum = activeTour.payouts.length + 1;

    };

    const removePayoutItem = (idx) => {
        if (activeTour.payouts.length <= 1) {
            alert("Cần duy trì ít nhất 1 mức giải thưởng!");
            return;
        }
        const newPayouts = activeTour.payouts.filter((_, i) => i !== idx);
        updateActiveTour('payouts', newPayouts);
    };

    const nextStepTour = (tourId) => {
        const now = Date.now();
        setTournaments(prev => prev.map(t => {
            if (t.id === tourId && t.gameStats.currentStepIdx < t.blinds.length - 1) {

                        currentStepIdx: nextIdx,

                    }

                    gameStats: {
                        ...t.gameStats,
                        currentStepIdx: prevIdx,
                        secondsLeft: prevSecs,
                        targetEndTime: t.gameStats.isPaused ? null : now + (prevSecs * 1000)
                    }
                };
            }
            return t;
        }));

                        <div className="bg-black/70 border border-gold/40 rounded-2xl p-5 shadow-2xl backdrop-blur-md space-y-4">
                            <div className="flex flex-wrap justify-between items-center border-b border-gray-800 pb-3 gap-2">
                                <h3 className="text-sm font-bold text-gold-bright uppercase flex items-center gap-2">
                                    <i className="fa-solid fa-gamepad"></i> Điều Khiển Trực Tiếp: <span className="text-white">{activeTour.config.name}</span>
                                </h3>
                                <div className="flex flex-wrap items-center gap-2">
                                    <button 
                                        onClick={() => prevStepTour(activeTour.id)}
                                        className="px-3 py-1.5 rounded bg-gray-800 hover:bg-gray-700 text-gold border border-gold/30 text-xs font-bold transition"
                                    >
                                        <i className="fa-solid fa-backward-step"></i> Prev Level
                                    </button>
                                    <button 
                                        onClick={() => togglePauseTour(activeTour.id)}
                                        className={`px-5 py-1.5 rounded text-xs font-black shadow transition ${activeTour.gameStats.isPaused ? 'bg-emerald-600 hover:bg-emerald-500 text-white' : 'bg-amber-600 hover:bg-amber-500 text-white'}`}
                                    >
                                        {activeTour.gameStats.isPaused ? '▶ START / RESUME' : '⏸ PAUSE'}
                                    </button>
                                    <button 
                                        onClick={() => nextStepTour(activeTour.id)}
                                        className="px-3 py-1.5 rounded bg-gray-800 hover:bg-gray-700 text-gold border border-gold/30 text-xs font-bold transition"
                                    >
                                        Next Level <i className="fa-solid fa-forward-step"></i>
                                    </button>

                                    <div className="flex items-center space-x-1 pl-2 border-l border-gray-700">
                                        <button onClick={() => adjustTimerSeconds(activeTour.id, -60)} className="px-2 py-1 bg-gray-800 hover:bg-red-900/60 text-red-300 rounded text-xs font-bold border border-red-700/40">-1m</button>
                                        <button onClick={() => adjustTimerSeconds(activeTour.id, 60)} className="px-2 py-1 bg-gray-800 hover:bg-emerald-900/60 text-emerald-300 rounded text-xs font-bold border border-emerald-700/40">+1m</button>
                                        <button onClick={() => adjustTimerSeconds(activeTour.id, 300)} className="px-2 py-1 bg-gray-800 hover:bg-emerald-900/60 text-emerald-300 rounded text-xs font-bold border border-emerald-700/40">+5m</button>
                                    </div>
                                </div>
                            </div>

                            <div className="grid grid-cols-3 gap-3">
                                {[
                                    { label: 'Buy-ins / Players', field: 'buyIns' },
                                    { label: 'Eliminated', field: 'eliminated' },
                                    { label: 'Total Re-buys', field: 'rebuys' }
                                ].map(({ label, field }) => (
                                    <div key={field} className="bg-black/50 p-3 rounded-xl border border-gray-800 text-center">
                                        <div className="text-xs text-gray-400 uppercase font-bold mb-1">{label}</div>
                                        <div className="text-2xl font-black text-gold-bright my-1">{activeTour.gameStats[field]}</div>
                                        <div className="flex justify-center space-x-2 mt-2">
                                            <button onClick={() => handleStatChange(field, -1)} className="w-8 h-8 bg-gray-800 hover:bg-gray-700 rounded-lg font-extrabold text-sm text-white">-</button>
                                            <button onClick={() => handleStatChange(field, 1)} className="w-8 h-8 bg-amber-500 hover:bg-amber-400 rounded-lg font-extrabold text-sm text-black">+</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                )}

                {activeView === 'player-tv' && (
                    <div className="w-full space-y-6">
                        {tournaments.map((tour) => (
                            <TournamentTVCard key={tour.id} tour={tour} openSinglePopout={openSinglePopoutWindow} />
                        ))}
                    </div>
                )}
            </main>

            <footer className="text-center py-2 text-xs text-gray-600 bg-black/60">
                Poker Tournament Timer System &copy; 2026 Snap Call Club. All rights reserved.
            </footer>
        </div>
    );
}

ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
