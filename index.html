        const SUPABASE_URL = "https://mkizhwumwxfqlwwfoief.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_XL_p7DDfizVqdz_mETXztw_7MecHfiQ";

        window.isFirstCloudSyncDone = false;
        window.lastCloudTimestamp = 0;
        window.popoutBroadcastChannel = new BroadcastChannel('snapcall_popout_sync');

        window.initCloudSync = async function(onDataReceived, onSyncStatusChange) {
            if (!SUPABASE_URL || !SUPABASE_ANON_KEY || !window.supabase) {
                console.warn("Supabase SDK chưa sẵn sàng.");
                onSyncStatusChange(false);
                return;
            }

            try {
                const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                onSyncStatusChange(true);

                // TẢI TRỰC TIẾP DỮ LIỆU TỪ CLOUD SUPABASE KHI TRANG VỪA MỞ LÊN (0ms DELAY)
                const fetchData = async () => {
                    const { data, error } = await supabaseClient
                        .from('tournaments')
                        .select('data, updated_at')
                        .eq('id', 'live_state')
                        .maybeSingle();

                    if (data && data.data) {
                        const recordTime = data.updated_at ? new Date(data.updated_at).getTime() : Date.now();
                        window.lastCloudTimestamp = recordTime;
                        window.isFirstCloudSyncDone = true;
                        // ÉP TRỰC TIẾP TOÀN BỘ STATE CLOUD BAO GỒM CẢ SELECTED_TOUR_ID
                        onDataReceived(data.data, true);
                    } else {
                        window.isFirstCloudSyncDone = true;
                    }
                };
                fetchData();

                // LÊN LỊCH QUÉT ĐỊNH KỲ MỖI 2 GIÂY CHỐNG NGHẼN WEBSOCKET REALTIME
                setInterval(fetchData, 2000);

                // LẮNG NGHE LỆNH REALTIME TỪ CÁC THIẾT BỊ KHÁC
                const channel = supabaseClient
                    .channel('room_poker_live', { config: { broadcast: { self: false } } })
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'tournaments' }, payload => {
                        if (payload.new && payload.new.data) {
                            const recordTime = payload.new.updated_at ? new Date(payload.new.updated_at).getTime() : Date.now();
                            if (recordTime >= window.lastCloudTimestamp) {
                                window.lastCloudTimestamp = recordTime;
                                window.isFirstCloudSyncDone = true;
                                onDataReceived(payload.new.data, true);
                            }
                        }
                    })
                    .on('broadcast', { event: 'tour_update' }, payload => {
                        if (payload.payload && payload.payload.data) {
                            const recordTime = payload.payload.timestamp || Date.now();
                            if (recordTime >= window.lastCloudTimestamp) {
                                window.lastCloudTimestamp = recordTime;
                                window.isFirstCloudSyncDone = true;
                                onDataReceived(payload.payload.data, true);
                            }
                        }
                    })
                    .subscribe();

                let dbSaveTimeout = null;
                window.saveTournamentsToCloud = async (appDataState) => {
                    if (!window.isFirstCloudSyncDone) return;
                    
                    const nowTime = Date.now();
                    window.lastCloudTimestamp = nowTime;

                    window.popoutBroadcastChannel.postMessage({ data: appDataState });

                    try {
                        channel.send({
                            type: 'broadcast',
                            event: 'tour_update',
                            payload: { data: appDataState, timestamp: nowTime }
                        });

                        if (dbSaveTimeout) clearTimeout(dbSaveTimeout);
                        dbSaveTimeout = setTimeout(async () => {
                            await supabaseClient
                                .from('tournaments')
                                .upsert({ id: 'live_state', data: appDataState, updated_at: new Date(nowTime).toISOString() });
                        }, 100);
                    } catch (e) {
                        console.warn("Lỗi lưu Supabase Cloud:", e);
                    }
                };
            } catch (err) {
                console.warn("Lỗi kết nối Supabase Cloud Sync:", err);
                onSyncStatusChange(false);
            }
        };
    </script>

                        <div className="text-white font-black" style={{ fontSize: `${fontSizes.statsPx || 30}px` }}>{avgStack.toLocaleString()}</div>

                    <div className="md:pt-1.5 md:border-t border-gray-800">

                        <div className="font-black text-gold-bright tracking-tight mb-2 sm:mb-3" style={{ fontSize: `${(fontSizes.payoutsPx || 24) + 10}px` }}>
                            {totalPointsFromPayouts.toLocaleString()} TOKEN
                        </div>

                        <div className="space-y-1.5 text-left border-t border-gray-800/80 pt-2.5 max-w-xs ml-auto" style={{ fontSize: `${fontSizes.payoutsPx || 24}px` }}>

                                <div key={idx} className="flex justify-between items-center font-bold px-1">
                                    <span className="text-gray-300">{p.place}</span>
                                    <span className="text-white">{p.value}</span>
                                </div>
                            ))}

                    </div>

                    {tour.config.qrCodeUrl && (
                        <div className="mt-2 pt-1 border-t border-gray-800/80 flex justify-end items-center gap-2">
                            <div className="text-right">
                                <div className="text-[9px] font-bold uppercase" style={{ color: themeStyle.blindsColor }}>Quét QR</div>
                                <div className="text-[8px] text-gray-400">Đăng ký & thông tin</div>
                            </div>
                            <img src={tour.config.qrCodeUrl} alt="QR Code" style={{ height: `${qrSize}px`, width: `${qrSize}px` }} className="object-contain rounded border border-gold/40 p-0.5 bg-black/60" />
                        </div>
                    )}
                </div>
            </div>

            <div className="mt-3 pt-2 border-t border-gray-800/80 flex justify-between items-center text-[10px] text-gray-500 font-medium">
                <div>SNAP CALL • BOARD GAME & COFFEE • EST. 2026</div>
                <div>Powered by Snap Call</div>
            </div>
        </div>
    );
}

function App() {
    const [activeView, setActiveView] = useState('combined-dashboard');
    const [wizardStep, setWizardStep] = useState(1);
    const [isCloudSynced, setIsCloudSynced] = useState(false);
    const [draggedBlindIdx, setDraggedBlindIdx] = useState(null);
    const [searchPhoneInput, setSearchPhoneInput] = useState('');
    const [searchResultPlayer, setSearchResultPlayer] = useState(null);
    const [showFontSizesCollapse, setShowFontSizesCollapse] = useState(false);
    
    // ĐỒNG HỒ ĐẾM NGƯỢC GIỜ KHAI MẠC REALTIME
    const [preTourCountdownSecs, setPreTourCountdownSecs] = useState(0);

    const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(() => {
        return localStorage.getItem('snapcall_admin_auth') === 'true';
    });
    const [showLoginModal, setShowLoginModal] = useState(false);
    const [targetProtectedView, setTargetProtectedView] = useState('admin');
    const [idInput, setIdInput] = useState('');
    const [pinInput, setPinInput] = useState('');
    const [loginError, setLoginError] = useState('');

    const isRemoteUpdating = useRef(false);
    const lastLocalString = useRef('');
    const userHasModified = useRef(false);

    const [appState, setAppState] = useState(() => {
        const saved = localStorage.getItem('poker_tournaments_live_v6');
        if (saved) {
            try { 
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed) && parsed.length > 0) return { tours: parsed, presets: [], selectedTourId: parsed[0].id };
                if (parsed && parsed.tours) return parsed;
            } catch(e) {}
        }
        return {
            tours: [defaultTourTemplate('SNAP HYPER', 101, 90, 90)],
            presets: [],
            selectedTourId: 101
        };
    });

    const tournaments = appState.tours || [];
    const presets = appState.presets || [];
    const selectedTourId = appState.selectedTourId || tournaments[0]?.id || 101;

    const activeTour = tournaments.find(t => t.id === selectedTourId) || tournaments[0] || defaultTourTemplate('SNAP HYPER', 101, 90, 90);

    const [draftConfigState, setDraftConfigState] = useState(() => JSON.parse(JSON.stringify(activeTour)));

    useEffect(() => {
        setDraftConfigState(JSON.parse(JSON.stringify(activeTour)));
    }, [selectedTourId]);

    // TÍNH TOÁN CỐ ĐỊNH GIỜ KHAI MẠC REALTIME
    useEffect(() => {
        const calcRemaining = () => {
            const startDateStr = activeTour.config.scheduledStartDate || getTodayDateString();
            const startTimeStr = activeTour.config.scheduledStartTime || '13:00';
            
            const [yyyy, mm, dd] = startDateStr.split('-').map(Number);
            const [hrs, mins] = startTimeStr.split(':').map(Number);
            
            const targetDate = new Date(yyyy, mm - 1, dd, hrs, mins, 0);
            const now = new Date();
            
            const diffSecs = Math.floor((targetDate.getTime() - now.getTime()) / 1000);
            return diffSecs;
        };

        setPreTourCountdownSecs(calcRemaining());

        const interval = setInterval(() => {
            setPreTourCountdownSecs(calcRemaining());
        }, 1000);

        return () => clearInterval(interval);
    }, [activeTour.config.scheduledStartDate, activeTour.config.scheduledStartTime]);

    // LỊCH TỰ ĐỘNG DỌN DẸP TOUR KẾT THÚC LÚC 02:00 AM SÁNG HÔM SAU
    useEffect(() => {
        const cleanupInterval = setInterval(() => {
            const now = new Date();
            if (now.getHours() === 2 && now.getMinutes() === 0) {
                setAppState(prev => {
                    const remainingTours = prev.tours.filter(t => !t.gameStats.isFinished);
                    if (remainingTours.length > 0 && remainingTours.length !== prev.tours.length) {
                        userHasModified.current = true;
                        return {
                            ...prev,
                            tours: remainingTours,
                            selectedTourId: remainingTours[0].id
                        };
                    }
                    return prev;
                });
            }
        }, 60000);
        return () => clearInterval(cleanupInterval);
    }, []);

    // ĐẤY DỮ LIỆU LÊN CLOUD NGAY LẬP TỨC KHI CHỌN TOUR MỚI (0ms DELAY)
    const setSelectedTourId = (newTourId) => {
        userHasModified.current = true;
        setAppState(prev => {
            const nextState = { ...prev, selectedTourId: newTourId };
            if (window.saveTournamentsToCloud) {
                window.saveTournamentsToCloud(nextState);
            }
            return nextState;
        });
    };

    // ĐỒNG BỘ REALTIME TỰ ĐỘNG KHI THIẾT BỊ MỚI VÀO - ÉP 100% THIẾT BỊ MỚI NHẬN TOUR ĐANG CHẠY CÙNG EPOCH TIMESTAMPS
    useEffect(() => {
        if (window.initCloudSync) {
            window.initCloudSync(
                (cloudState, isFromRemote) => {
                    if (cloudState) {
                        let normalizedState = cloudState;
                        if (Array.isArray(cloudState)) {
                            normalizedState = { tours: cloudState, presets: [], selectedTourId: cloudState[0]?.id || 101 };
                        }
                        
                        isRemoteUpdating.current = true;
                        lastLocalString.current = JSON.stringify(normalizedState);
                        setAppState(normalizedState);
                        setTimeout(() => { isRemoteUpdating.current = false; }, 300);
                    }
                },
                (status) => setIsCloudSynced(status)
            );
        }
    }, []);

    useEffect(() => {
        try {
            const currentStr = JSON.stringify(appState);
            localStorage.setItem('poker_tournaments_live_v6', currentStr);
            
            if (window.popoutBroadcastChannel) {
                window.popoutBroadcastChannel.postMessage({ data: appState });
            }

            // CHỈ GỬI LÊN CLOUD KHI USER CÓ THAO TÁC THỰC TẾ (NÚT BẤM / ĐỔI TOUR / EDIT)
            if (userHasModified.current && window.isFirstCloudSyncDone && !isRemoteUpdating.current && currentStr !== lastLocalString.current) {
                lastLocalString.current = currentStr;
                userHasModified.current = false;
                if (window.saveTournamentsToCloud) {
                    window.saveTournamentsToCloud(appState);
                }
            }
        } catch(e) {
            console.warn("Storage quota limit:", e);
        }
    }, [appState]);

    const applyDraftChangesToLive = () => {
        userHasModified.current = true;
        setAppState(prev => {
            const nextState = {
                ...prev,
                tours: prev.tours.map(t => t.id === selectedTourId ? JSON.parse(JSON.stringify(draftConfigState)) : t)
            };
            if (window.saveTournamentsToCloud) {
                window.saveTournamentsToCloud(nextState);
            }
            return nextState;
        });
        alert(`Đã CẬP NHẬT thành công cài đặt cho Tour "${draftConfigState.config.name}"!`);
    };

    const handleLoginSubmit = (e) => {
        e.preventDefault();
        if (idInput.trim() === 'Admin' && pinInput === '123456') {
            setIsAdminLoggedIn(true);
            localStorage.setItem('snapcall_admin_auth', 'true');
            setShowLoginModal(false);
            setIdInput('');
            setPinInput('');
            setLoginError('');
            setActiveView(targetProtectedView);
        } else {
            setLoginError('ID hoặc Mật khẩu không chính xác!');
        }
    };

    const handleLogout = () => {
        setIsAdminLoggedIn(false);
        localStorage.removeItem('snapcall_admin_auth');
        setActiveView('combined-dashboard');
    };

    const navigateToProtectedView = (viewName) => {
        if (isAdminLoggedIn) {
            setActiveView(viewName);
        } else {
            setTargetProtectedView(viewName);
            setShowLoginModal(true);
        }
    };

    const playSoundEffect = (soundType) => {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();

            if (soundType === 'Boxing Bell') {
                [0, 150].forEach(delay => {
                    setTimeout(() => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(1200, ctx.currentTime);
                        gain.gain.setValueAtTime(0.5, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.8);
                    }, delay);
                });
            } else if (soundType === 'Chime Bell') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.4, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 1.2);
            } else if (soundType === 'Digital Beep') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(1500, ctx.currentTime);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.25);
            } else if (soundType === 'Whistle') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(2400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(2800, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.4, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            }
        } catch (e) {
            console.log("Audio play error:", e);
        }
    };

    // ĐỒNG BỘ THỜI GIAN THEO THỜI GIAN NỀN MÁY CHỦ REALTIME ABSOLUTE TIMESTAMPS
    useEffect(() => {
        const timer = setInterval(() => {
            const now = Date.now();
            setAppState(prevState => {
                let changed = false;
                const newTours = prevState.tours.map(tour => {
                    if (tour.gameStats.isPaused || tour.gameStats.isFinished || !tour.gameStats.targetEndTime) {
                        return tour;
                    }

                    const remainingSecs = Math.max(0, Math.ceil((tour.gameStats.targetEndTime - now) / 1000));

                    if (remainingSecs > 0) {
                        if (remainingSecs !== tour.gameStats.secondsLeft) {
                            changed = true;
                            return {
                                ...tour,
                                gameStats: { ...tour.gameStats, secondsLeft: remainingSecs }
                            };
                        }
                        return tour;
                    } else {
                        changed = true;
                        const currentItem = tour.blinds[tour.gameStats.currentStepIdx];
                        if (currentItem && currentItem.type === 'break') {
                            playSoundEffect(tour.soundsConfig.breakEnd || 'Chime Bell');
                        } else {
                            playSoundEffect(tour.soundsConfig.nextLevel || 'Boxing Bell');
                        }

                        const nextIdx = tour.gameStats.currentStepIdx + 1;
                        if (nextIdx < tour.blinds.length) {
                            const nextStep = tour.blinds[nextIdx];
                            const nextLengthSecs = (nextStep.length || 15) * 60;
                            return {
                                ...tour,
                                gameStats: {
                                    ...tour.gameStats,
                                    currentStepIdx: nextIdx,
                                    secondsLeft: nextLengthSecs,
                                    targetEndTime: now + (nextLengthSecs * 1000)
                                }
                            };
                        } else {
                            return {
                                ...tour,
                                gameStats: { ...tour.gameStats, secondsLeft: 0, targetEndTime: null, isPaused: true }
                            };
                        }
                    }
                });

                if (changed) {
                    return { ...prevState, tours: newTours };
                }
                return prevState;
            });
        }, 300);
        return () => clearInterval(timer);
    }, []);

    const updateDraftConfig = (field, value) => {
        setDraftConfigState(prev => ({
            ...prev,
            config: { ...prev.config, [field]: value }
        }));
    };

    const updateDraftFontSize = (field, val) => {
        const numVal = val === '' ? '' : Number(val);
        setDraftConfigState(prev => ({
            ...prev,
            config: {
                ...prev.config,
                fontCustomSizes: {
                    ...(prev.config.fontCustomSizes || {}),
                    [field]: numVal
                }
            }
        }));
    };

    const handleFileUploadDraft = (e, configField) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 800;

                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.75);
                    updateDraftConfig(configField, compressedBase64);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    };

    const handleStatChange = (field, delta) => {
        userHasModified.current = true;
        setAppState(prev => {
            const nextState = {
                ...prev,
                tours: prev.tours.map(t => {
                    if (t.id === selectedTourId) {
                        return {
                            ...t,
                            gameStats: {
                                ...t.gameStats,
                                [field]: Math.max(0, (t.gameStats[field] || 0) + delta)
                            }
                        };
                    }
                    return t;
                })
            };
            if (window.saveTournamentsToCloud) {
                window.saveTournamentsToCloud(nextState);
            }
            return nextState;
        });
    };

    const togglePauseTour = (tourId) => {
        userHasModified.current = true;
        const now = Date.now();
        setAppState(prev => {
            const nextState = {
                ...prev,
                tours: prev.tours.map(t => {
                    if (t.id === tourId) {
                        const willPause = !t.gameStats.isPaused;
                        if (willPause) {
                            return {
                                ...t,
                                gameStats: {
                                    ...t.gameStats,
                                    isPaused: true,
                                    targetEndTime: null
                                }
                            };
                        } else {
                            return {
                                ...t,
                                gameStats: {
                                    ...t.gameStats,
                                    isPaused: false,
                                    isFinished: false,
                                    targetEndTime: now + (t.gameStats.secondsLeft * 1000)
                                }
                            };
                        }
                    }
                    return t;
                })
            };
            if (window.saveTournamentsToCloud) {
                window.saveTournamentsToCloud(nextState);
            }
            return nextState;
        });
    };

    const finishTour = (tourId) => {
        if (window.confirm("Bạn có chắc chắn muốn KẾT THÚC Tour đấu này? Giao diện TV sẽ hiển thị vinh danh kết thúc.")) {
            userHasModified.current = true;
            setAppState(prev => {
                const nextState = {
                    ...prev,
                    tours: prev.tours.map(t => {
                        if (t.id === tourId) {
                            return {
                                ...t,
                                gameStats: {
                                    ...t.gameStats,
                                    isPaused: true,
                                    isFinished: true,
                                    targetEndTime: null
                                }
                            };
                        }
                        return t;
                    })
                };
                if (window.saveTournamentsToCloud) {
                    window.saveTournamentsToCloud(nextState);
                }
                return nextState;
            });
        }
    };

    const adjustTimerSeconds = (tourId, deltaSeconds) => {
        userHasModified.current = true;
        const now = Date.now();
        setAppState(prev => {
            const nextState = {
                ...prev,
                tours: prev.tours.map(t => {
                    if (t.id === tourId) {
                        const newSecs = Math.max(0, t.gameStats.secondsLeft + deltaSeconds);
                        return {
                            ...t,
                            gameStats: {
                                ...t.gameStats,
                                secondsLeft: newSecs,
                                targetEndTime: t.gameStats.isPaused ? null : now + (newSecs * 1000)
                            }
                        };
                    }
                    return t;
                })
            };
            if (window.saveTournamentsToCloud) {
                window.saveTournamentsToCloud(nextState);
            }
            return nextState;
        });
    };

    const addNewTournament = () => {
        userHasModified.current = true;
        const newId = Date.now();
        const newTour = defaultTourTemplate(`TOUR #${tournaments.length + 1}`, newId, 100, 100);
        newTour.gameStats.isPaused = true;
        newTour.gameStats.targetEndTime = null;

        isRemoteUpdating.current = false;
        setAppState(prev => {
            const nextState = { ...prev, tours: [...prev.tours, newTour], selectedTourId: newId };
            if (window.saveTournamentsToCloud) {
                window.saveTournamentsToCloud(nextState);
            }
            return nextState;
        });
    };

    const removeTournament = (tourId) => {
        if (tournaments.length <= 1) {
            alert("Cần duy trì ít nhất 1 giải đấu trong hệ thống!");
            return;
        }
        if (window.confirm("Xóa giải đấu này khỏi hệ thống?")) {
            userHasModified.current = true;
            isRemoteUpdating.current = false;
            const remaining = tournaments.filter(t => t.id !== tourId);
            setAppState(prev => {
                const nextState = { ...prev, tours: remaining, selectedTourId: remaining[0].id };
                if (window.saveTournamentsToCloud) {
                    window.saveTournamentsToCloud(nextState);
                }
                return nextState;
            });
        }
    };

    const saveCurrentTourAsPreset = () => {
        const presetName = prompt("Nhập tên để lưu mẫu Tour này (vd: Monster Stack 100k, High Roller 500k):", activeTour.config.name);
        if (!presetName) return;

        userHasModified.current = true;
        const newPreset = {
            id: Date.now(),
            name: presetName,
            tourTemplate: JSON.parse(JSON.stringify(activeTour))
        };

        setAppState(prev => {
            const nextState = {
                ...prev,
                presets: [...(prev.presets || []).filter(p => p.name !== presetName), newPreset]
            };
            if (window.saveTournamentsToCloud) {
                window.saveTournamentsToCloud(nextState);
            }
            return nextState;
        });
        alert(`Đã lưu mẫu tour "${presetName}" thành công!`);
    };

    const applyPresetToActiveTour = (presetObj) => {
        if (window.confirm(`Bạn có muốn nạp mẫu tour "${presetObj.name}" đè lên tour "${activeTour.config.name}" hiện tại?`)) {
            userHasModified.current = true;
            const loaded = JSON.parse(JSON.stringify(presetObj.tourTemplate));
            loaded.id = selectedTourId;
            loaded.gameStats.isPaused = true;
            loaded.gameStats.targetEndTime = null;

            setAppState(prev => {
                const nextState = {
                    ...prev,
                    tours: prev.tours.map(t => t.id === selectedTourId ? loaded : t)
                };
                if (window.saveTournamentsToCloud) {
                    window.saveTournamentsToCloud(nextState);
                }
                return nextState;
            });
        }
    };

    const deletePreset = (presetId, presetName) => {
        if (window.confirm(`Bạn có chắc chắn muốn XÓA mẫu tour "${presetName}" khỏi thư viện?`)) {
            userHasModified.current = true;
            setAppState(prev => {
                const nextState = {
                    ...prev,
                    presets: (prev.presets || []).filter(p => p.id !== presetId)
                };
                if (window.saveTournamentsToCloud) {
                    window.saveTournamentsToCloud(nextState);
                }
                return nextState;
            });
        }
    };

    const saveSingleTourToFile = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(activeTour, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `tour_${activeTour.config.name.replace(/\s+/g, '_')}_${Date.now()}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    };

    const loadSingleTourFromFile = (e) => {
        const fileReader = new FileReader();
        if (e.target.files && e.target.files[0]) {
            fileReader.readAsText(e.target.files[0], "UTF-8");
            fileReader.onload = (event) => {
                try {
                    const parsedData = JSON.parse(event.target.result);
                    if (parsedData && parsedData.config && parsedData.blinds) {
                        userHasModified.current = true;
                        isRemoteUpdating.current = false;
                        setAppState(prev => {
                            const nextState = {
                                ...prev,
                                tours: prev.tours.map(t => {

    const calculateNextProfessionalBlind = (currentBb) => {
        const standardSequence = [
            100, 200, 300, 400, 500, 600, 800, 
            1000, 1200, 1500, 2000, 2500, 3000, 4000, 5000, 6000, 8000, 
            10000, 12000, 15000, 20000, 25000, 30000, 40000, 50000, 60000, 80000, 
            100000, 120000, 150000, 200000, 250000, 300000, 400000, 500000, 600000, 800000,
            1000000
        ];

        const matchIdx = standardSequence.findIndex(val => val > currentBb);
        let rawSb = 0;
        let nextBb = 0;

        if (matchIdx !== -1) {
            nextBb = standardSequence[matchIdx];
            rawSb = Math.round(nextBb / 2);
        } else {
            nextBb = Math.round((currentBb * 1.5) / 1000) * 1000;
            rawSb = Math.round(nextBb / 2);
        }
        
        let roundedSb = rawSb;
        if (rawSb >= 100 && rawSb % 100 !== 0) {
            roundedSb = Math.ceil(rawSb / 100) * 100;
        }

        return { sb: roundedSb, bb: nextBb, ante: nextBb };
    };

            const lastLevel = [...draftConfigState.blinds].reverse().find(b => b.type === 'level');

                newLevelObj = {
                    id: Date.now(),
                    type: 'level',
                    sb: nextBlinds.sb,
                    bb: nextBlinds.bb,
                    ante: nextBlinds.ante,
