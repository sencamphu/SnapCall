<script>
const SUPABASE_URL = "https://mkizhwumwxfqlwwfoief.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_XL_p7DDfizVqdz_mETXztw_7MecHfiQ";

window.supabaseClient = null;
window.supabaseChannel = null;

window.initCloudSync = async function(onDataReceived, onSyncStatusChange) {
    if (!SUPABASE_URL || !SUPABASE_ANON_KEY || !window.supabase) {
        console.warn("Supabase SDK chưa sẵn sàng.");
        onSyncStatusChange(false);
        return;
    }

    try {
        window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        onSyncStatusChange(true);

        const fetchData = async () => {
            try {
                const { data, error } = await window.supabaseClient
                    .from('tournaments')
                    .select('data')
                    .eq('id', 'live_state')
                    .maybeSingle();

                if (data && data.data && data.data.tours && data.data.tours.length > 0) {
                    onDataReceived(data.data);
                } else {
                    console.log("Supabase Cloud chưa có dữ liệu cấu trúc live_state.");
                }
            } catch(e) {
                console.warn("Fetch Error:", e);
            }
        };

        await fetchData();

        window.supabaseChannel = window.supabaseClient
            .channel('room_poker_live_v30', { config: { broadcast: { self: true } } })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'tournaments' }, payload => {
                if (payload.new && payload.new.data) {
                    onDataReceived(payload.new.data);
                }
            })
            .on('broadcast', { event: 'tour_update' }, payload => {
                if (payload.payload && payload.payload.data) {
                    onDataReceived(payload.payload.data);
                }
            })
            .subscribe();

    } catch (err) {
        console.warn("Lỗi kết nối Supabase Cloud Sync:", err);
        onSyncStatusChange(false);
    }
};

window.saveAppStateToCloud = async (appDataState) => {
    try {
        const payloadData = {
            tours: appDataState.tours,
            presets: appDataState.presets || [],
            lastUpdated: appDataState.lastUpdated || Date.now()
        };

        if (window.supabaseChannel) {
            window.supabaseChannel.send({
                type: 'broadcast',
                event: 'tour_update',
                payload: { data: payloadData }
            });
        }

        if (window.supabaseClient) {
            const { error } = await window.supabaseClient
                .from('tournaments')
                .upsert({ 
                    id: 'live_state', 
                    data: payloadData, 
                    updated_at: new Date().toISOString() 
                }, { onConflict: 'id' });

            if (error) {
                console.error("Lỗi Upsert Supabase:", error);
            }
        }

        localStorage.setItem('snapcall_live_app_state', JSON.stringify(payloadData));
    } catch (e) {
        console.warn("Lỗi lưu Supabase Cloud:", e);
    }
};
</script>

const playSoundEffect = (soundType) => {
    try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        const ctx = new AudioContextClass();
        if (ctx.state === 'suspended') {
            ctx.resume();
        }

        if (soundType === 'Boxing Bell' || soundType === 'Chuông Đấu Kê') {
            [0, 180].forEach(delay => {
                setTimeout(() => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1320, ctx.currentTime);
                    gain.gain.setValueAtTime(0.6, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.9);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.9);
                }, delay);
            });
        } else if (soundType === 'Chime Bell' || soundType === 'Chuông Ngân Vang') {
            const frequencies = [523.25, 659.25, 783.99, 1046.50];
            frequencies.forEach((freq, index) => {
                setTimeout(() => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime);
                    gain.gain.setValueAtTime(0.4, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 1.4);
                }, index * 120);
            });
        } else if (soundType === 'Digital Beep' || soundType === 'Bíp Điện Tử') {
            [0, 150, 300].forEach(delay => {
                setTimeout(() => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(1760, ctx.currentTime);
                    gain.gain.setValueAtTime(0.25, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.15);
                }, delay);
            });
        } else if (soundType === 'Whistle' || soundType === 'Còi Trọng Tài') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(2500, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(3100, ctx.currentTime + 0.25);
            osc.frequency.exponentialRampToValueAtTime(2500, ctx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.45, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.6);
        }
    } catch (e) {
        console.log("Audio play error:", e);
    }
};

function TournamentTVCard({ tour, openSinglePopout, isStandaloneTVMode }) {
    if (!tour) return null;
    const currentStep = (tour.blinds && tour.blinds[tour.gameStats.currentStepIdx]) || (tour.blinds && tour.blinds[0]) || { type: 'level', sb: 100, bb: 100, ante: 100 };

    const getCalculatedLevelNumber = (blindsList, stepIndex) => {
        let levelNum = 0;
        if (!blindsList) return 1;
        for (let i = 0; i <= stepIndex && i < blindsList.length; i++) {
            if (blindsList[i].type === 'level') levelNum++;
        }
        return Math.max(1, levelNum);
    };

    const getSecondsToNextBreak = (t) => {
        let totalSecs = t.gameStats.secondsLeft || 0;
        if (!t.blinds) return totalSecs;
        for (let i = t.gameStats.currentStepIdx + 1; i < t.blinds.length; i++) {
            if (t.blinds[i].type === 'break') break;
            totalSecs += (t.blinds[i].length || 15) * 60;
        }
        return totalSecs;
    };

    const getNextLevelInfo = (t) => {
        if (!t.blinds) return 'END GAME';
        for (let i = t.gameStats.currentStepIdx + 1; i < t.blinds.length; i++) {
            if (t.blinds[i].type === 'level') {
                return `${(t.blinds[i].sb || 0).toLocaleString()}/${(t.blinds[i].bb || 0).toLocaleString()}`;
            } else if (t.blinds[i].type === 'break') {
                return 'Break Time';
            }
        }
        return 'MAX LEVEL REACHED';
    };

    const formatTime = (totalSeconds) => {
        const mins = Math.floor(Math.max(0, totalSeconds) / 60);
        const secs = Math.floor(Math.max(0, totalSeconds) % 60);
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    };

    const formatTimeHHMMSS = (totalSeconds) => {
        const hrs = Math.floor(totalSeconds / 3600);
        const mins = Math.floor((totalSeconds % 3600) / 60);
        const secs = Math.floor(totalSeconds % 60);
        return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    };

    const currentLevelNum = getCalculatedLevelNumber(tour.blinds, tour.gameStats.currentStepIdx);
    const totalEntries = (tour.gameStats.buyIns || 0) + (tour.gameStats.rebuys || 0);
    const totalPointsFromPayouts = (tour.payouts || []).reduce((sum, p) => sum + (Number(p.value) || 0), 0);
    const totalChipsInPlay = totalEntries * (tour.config.startingStack || 25000);

    return (
        <div

                backgroundImage: tour.config.bgImageUrl ? `url(${tour.config.bgImageUrl})` : 'none',
                backgroundSize: 'cover',
                backgroundPosition: 'center'
            }}

            {openSinglePopout && !isStandaloneTVMode && (

                                ? '🏆 TOUR FINISHED'
                                : (currentStep.type === 'break'
                                    ? `BREAK TIME ${currentStep.title ? `(${currentStep.title})` : ''}`
                                    : `LEVEL ${currentLevelNum}`)}
                        </span>
                    </div>

                    <div className="py-2 flex justify-center items-center">
                        {tour.gameStats.isFinished ? (
                            <div className="font-timer font-black tracking-wider leading-none text-emerald-400 drop-shadow-lg" style={{ fontSize: `${fontSizes.timerPx || 120}px` }}>

                        ) : tour.gameStats.isPaused ? (
                            <div className="font-timer font-black tracking-wider leading-none text-red-500 animate-pause-pulse drop-shadow-lg" style={{ fontSize: `${fontSizes.timerPx || 120}px` }}>

                    <div className="font-bold tracking-wider" style={{ fontSize: `${fontSizes.blindsPx || 54}px`, color: themeStyle.blindsColor }}>
                        {tour.gameStats.isFinished ? 'CẢM ƠN QUÝ HỘI VIÊN ĐÃ THAM GIA' : (currentStep.type === 'break' ? 'BREAK TIME' : `BLINDS : ${(currentStep.sb || 0).toLocaleString()} / ${(currentStep.bb || 0).toLocaleString()}`)}
                    </div>

                    {currentStep.type !== 'break' && !tour.gameStats.isFinished && (
                        <div className="font-bold tracking-wider" style={{ fontSize: `${Math.max(14, (fontSizes.blindsPx || 54) - 10)}px`, color: themeStyle.blindsColor }}>
                            ANTE : {(currentStep.ante || 0).toLocaleString()}
                        </div>
                    )}

                    {currentStep.type === 'break' && !tour.gameStats.isFinished && (currentStep.isChipRace || currentStep.chipRaceTitle) && (
                        <div className="font-bold tracking-wider mt-2 text-amber-300 animate-pulse" style={{ fontSize: `${Math.max(16, (fontSizes.blindsPx || 54) - 12)}px` }}>
                            CHIP RACE : {currentStep.chipRaceTitle || '100, 500'}

                    )}

                    <div className="w-full max-w-sm mx-auto border-b border-gold/30 my-2"></div>

                    <div className="text-gray-200 font-medium tracking-wide" style={{ fontSize: `${fontSizes.nextLevelPx || 46}px` }}>
                        Next: <span className="text-white font-semibold">{tour.gameStats.isFinished ? 'END GAME' : getNextLevelInfo(tour)}</span>
                    </div>
                </div>

                <div className="w-full lg:col-span-3 lg:order-1 grid grid-cols-2 sm:grid-cols-3 lg:flex lg:flex-col gap-3 text-left border-t lg:border-t-0 lg:border-l border-gold/20 pt-4 lg:pt-0 lg:pl-4">
                    <div className="bg-black/50 p-3 rounded-2xl border border-gray-800">
                        <div className="text-gray-400 font-bold tracking-wider uppercase mb-0.5" style={{ fontSize: `${Math.max(10, (fontSizes.statsPx || 30) - 12)}px` }}>PLAYERS</div>
                        <div className="text-white font-black" style={{ fontSize: `${fontSizes.statsPx || 30}px` }}>{playersLeft} / {tour.gameStats.buyIns}</div>
                    </div>

                    <div className="bg-black/50 p-3 rounded-2xl border border-gray-800">
                        <div className="text-gray-400 font-bold tracking-wider uppercase mb-0.5" style={{ fontSize: `${Math.max(10, (fontSizes.statsPx || 30) - 12)}px` }}>RE-BUY</div>
                        <div className="text-white font-black" style={{ fontSize: `${fontSizes.statsPx || 30}px` }}>{tour.gameStats.rebuys}</div>
                    </div>

                    <div className="bg-black/50 p-3 rounded-2xl border border-gray-800">
                        <div className="text-gray-400 font-bold tracking-wider uppercase mb-0.5" style={{ fontSize: `${Math.max(10, (fontSizes.statsPx || 30) - 12)}px` }}>TOTAL ENTRIES</div>
                        <div className="text-white font-black" style={{ fontSize: `${fontSizes.statsPx || 30}px` }}>{totalEntries}</div>
                    </div>

                    <div className="bg-black/50 p-3 rounded-2xl border border-gray-800">
                        <div className="text-gray-400 font-bold tracking-wider uppercase mb-0.5" style={{ fontSize: `${Math.max(10, (fontSizes.statsPx || 30) - 12)}px` }}>TOTAL STACK</div>
                        <div className="text-white font-black" style={{ fontSize: `${fontSizes.statsPx || 30}px` }}>{totalChipsInPlay.toLocaleString()}</div>
                    </div>

                    <div className="bg-black/50 p-3 rounded-2xl border border-gray-800">
                        <div className="text-gray-400 font-bold tracking-wider uppercase mb-0.5" style={{ fontSize: `${Math.max(10, (fontSizes.statsPx || 30) - 12)}px` }}>AVG STACK</div>
                        <div className="text-white font-black" style={{ fontSize: `${fontSizes.statsPx || 30}px` }}>{avgStack.toLocaleString()}</div>
                    </div>

                    <div className="bg-black/50 p-3 rounded-2xl border border-gray-800 lg:pt-2.5">
                        <div className="text-gray-400 font-bold tracking-wider uppercase mb-0.5" style={{ fontSize: `${Math.max(10, (fontSizes.statsPx || 30) - 12)}px` }}>NEXT BREAK</div>
                        <div className="text-white font-black" style={{ fontSize: `${fontSizes.statsPx || 30}px` }}>{nextBreakTime}</div>
                    </div>
                </div>

                <div className="w-full lg:col-span-3 lg:order-3 text-right flex flex-col justify-center h-full border-t lg:border-t-0 border-gold/20 pt-4 lg:pt-0 my-auto">
                    <div className="w-full text-center lg:text-right my-auto bg-black/50 p-4 rounded-2xl border border-gray-800">
                        <div className="text-gray-400 font-semibold tracking-widest uppercase mb-1" style={{ fontSize: `${Math.max(10, (fontSizes.payoutsPx || 24) - 6)}px` }}>PRIZE POOL</div>

                        <div className="font-black text-gold-bright tracking-tight mb-3" style={{ fontSize: `${(fontSizes.payoutsPx || 24) + 10}px` }}>
                            {totalPointsFromPayouts.toLocaleString()} TOKEN
                        </div>

                        <div className="space-y-2 text-left border-t border-gray-800 pt-3 max-w-xs mx-auto lg:ml-auto" style={{ fontSize: `${fontSizes.payoutsPx || 24}px` }}>
                            {(tour.payouts || []).map((p, idx) => (
                                <div key={idx} className="flex justify-between items-center font-bold px-1">
                                    <span className="text-gray-300">{p.place}</span>
                                    <span className="text-white">{p.value}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    {tour.config.qrCodeUrl && (
                        <div className="mt-3 pt-2 border-t border-gray-800 flex justify-end items-center gap-3">
                            <div className="text-right">
                                <div className="text-[11px] font-bold uppercase" style={{ color: themeStyle.blindsColor }}>Quét QR</div>
                                <div className="text-[9px] text-gray-400">Đăng ký & thông tin</div>
                            </div>
                            <img src={tour.config.qrCodeUrl} alt="QR Code" style={{ height: `${qrSize}px`, width: `${qrSize}px` }} className="object-contain rounded-xl border border-gold/40 p-1 bg-black/60 shadow" />
                        </div>
                    )}
                </div>
            </div>

            <div className="mt-4 pt-3 border-t border-gray-800 flex flex-col sm:flex-row justify-between items-center text-[11px] text-gray-400 font-medium gap-1">
                <div>SNAP CALL • BOARD GAME & COFFEE • EST. 2026</div>
                <div>Professional Poker Tournament System</div>
            </div>
        </div>
    );
}

function App() {
    const [isStandaloneTV, setIsStandaloneTV] = useState(false);
    const [standaloneTourId, setStandaloneTourId] = useState(null);

    const [activeView, setActiveView] = useState('combined-dashboard');
    const [wizardStep, setWizardStep] = useState(1);
    const [isCloudSynced, setIsCloudSynced] = useState(false);
    const [draggedBlindIdx, setDraggedBlindIdx] = useState(null);
    const [searchPhoneInput, setSearchPhoneInput] = useState('');
    const [searchResultPlayer, setSearchResultPlayer] = useState(null);
    const [showFontSizesCollapse, setShowFontSizesCollapse] = useState(false);

    const [preTourCountdownSecs, setPreTourCountdownSecs] = useState(0);

    const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(() => {
        return localStorage.getItem('snapcall_admin_auth') === 'true';
    });
    const [showLoginModal, setShowLoginModal] = useState(false);
    const [targetProtectedView, setTargetProtectedView] = useState('admin');
    const [idInput, setIdInput] = useState('');
    const [pinInput, setPinInput] = useState('');
    const [loginError, setLoginError] = useState('');

    const [appState, setAppState] = useState(() => {
        const cached = localStorage.getItem('snapcall_live_app_state');
        if (cached) {
            try {
                const parsed = JSON.parse(cached);
                if (parsed && parsed.tours && parsed.tours.length > 0) return parsed;
            } catch(e) {}
        }
        return {
            tours: [
                defaultTourTemplate('MONTER STACK', 101, 100, 100)
            ],
            presets: [],
            lastUpdated: Date.now()
        };
    });

    const [adminSetupTourId, setAdminSetupTourId] = useState(101);
    const [publicViewTourId, setPublicViewTourId] = useState(101);

    useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const viewParam = urlParams.get('view');
        const tourIdParam = urlParams.get('tourId');
        if (viewParam === 'tv') {
            setIsStandaloneTV(true);
            if (tourIdParam) {
                setStandaloneTourId(Number(tourIdParam));
            }
        }
    }, []);

    const tournaments = (appState && appState.tours && appState.tours.length > 0) ? appState.tours : [defaultTourTemplate('MONTER STACK', 101, 100, 100)];
    const presets = (appState && appState.presets) ? appState.presets : [];

    const activePublicTour = tournaments.find(t => t.id === publicViewTourId) || tournaments[0];
    const activeAdminTour = tournaments.find(t => t.id === adminSetupTourId) || tournaments[0];

    const [draftConfigState, setDraftConfigState] = useState(() => JSON.parse(JSON.stringify(activeAdminTour)));

    useEffect(() => {
        if (activeAdminTour) {
            setDraftConfigState(JSON.parse(JSON.stringify(activeAdminTour)));
        }
    }, [adminSetupTourId, activeAdminTour ? activeAdminTour.id : 0, appState.lastUpdated]);

    useEffect(() => {
        if (window.initCloudSync) {
            window.initCloudSync(
                (cloudState) => {
                    if (cloudState && cloudState.tours && Array.isArray(cloudState.tours) && cloudState.tours.length > 0) {
                        setAppState(prevState => {
                            const cloudTime = cloudState.lastUpdated || 0;
                            const localTime = prevState.lastUpdated || 0;
                            if (cloudTime >= localTime) {
                                localStorage.setItem('snapcall_live_app_state', JSON.stringify(cloudState));
                                return cloudState;
                            }
                            return prevState;
                        });
                        setAdminSetupTourId(currId => cloudState.tours.some(t => t.id === currId) ? currId : cloudState.tours[0].id);
                        setPublicViewTourId(currId => cloudState.tours.some(t => t.id === currId) ? currId : cloudState.tours[0].id);
                    }
                },
                (status) => setIsCloudSynced(status)
            );
        }
    }, []);

    useEffect(() => {
        if (appState && appState.tours && appState.tours.length > 0 && window.saveAppStateToCloud) {
            window.saveAppStateToCloud(appState);
        }
    }, []);

    useEffect(() => {
        const calcRemaining = () => {
            if (!activePublicTour || !activePublicTour.config) return 0;
            const startDateStr = activePublicTour.config.scheduledStartDate || getTodayDateString();
            const startTimeStr = activePublicTour.config.scheduledStartTime || '13:00';

            const [yyyy, mm, dd] = startDateStr.split('-').map(Number);
            const [hrs, mins] = startTimeStr.split(':').map(Number);

            const targetDate = new Date(yyyy, (mm || 1) - 1, dd || 1, hrs || 0, mins || 0, 0);
            const now = new Date();

            return Math.floor((targetDate.getTime() - now.getTime()) / 1000);
        };

        setPreTourCountdownSecs(calcRemaining());

        const interval = setInterval(() => {
            setPreTourCountdownSecs(calcRemaining());
        }, 1000);

        return () => clearInterval(interval);
    }, [activePublicTour ? activePublicTour.config.scheduledStartDate : '', activePublicTour ? activePublicTour.config.scheduledStartTime : '', activePublicTour ? activePublicTour.id : 0]);

    const handlePublicViewTourClick = (tourId) => {
        setPublicViewTourId(tourId);
    };

    const handleAdminSelectTourId = (tourId) => {
        setAdminSetupTourId(tourId);
    };

    const applyDraftChangesToLive = () => {
        setAppState(prev => {
            const nextState = {
                ...prev,
                tours: prev.tours.map(t => t.id === adminSetupTourId ? JSON.parse(JSON.stringify(draftConfigState)) : t),
                lastUpdated: Date.now()
            };
            if (window.saveAppStateToCloud) {
                window.saveAppStateToCloud(nextState);
            }
            return nextState;
        });
        alert(`Đã CẬP NHẬT thành công cài đặt cho Tour "${draftConfigState.config.name}"!`);
    };

    const handleLoginSubmit = (e) => {
        e.preventDefault();
        if (idInput.trim() === 'Admin' && pinInput === '123456') {
            setIsAdminLoggedIn(true);
            localStorage.setItem('snapcall_admin_auth', 'true');
            setShowLoginModal(false);
            setIdInput('');
            setPinInput('');
            setLoginError('');
            setActiveView(targetProtectedView);
        } else {
            setLoginError('ID hoặc Mật khẩu không chính xác!');
        }
    };

    const handleLogout = () => {
        setIsAdminLoggedIn(false);
        localStorage.removeItem('snapcall_admin_auth');
        setActiveView('combined-dashboard');
    };

    const navigateToProtectedView = (viewName) => {
        if (isAdminLoggedIn) {
            setActiveView(viewName);
        } else {
            setTargetProtectedView(viewName);
            setShowLoginModal(true);
        }
    };

    useEffect(() => {
        const timer = setInterval(() => {
            const now = Date.now();
            setAppState(prevState => {
                let changed = false;
                const newTours = prevState.tours.map(tour => {
                    if (tour.gameStats.isPaused || tour.gameStats.isFinished || !tour.gameStats.targetEndTime) {
                        return tour;
                    }

                    const remainingSecs = Math.max(0, Math.ceil((tour.gameStats.targetEndTime - now) / 1000));

                    if (remainingSecs > 0) {
                        if (remainingSecs !== tour.gameStats.secondsLeft) {
                            changed = true;
                            return {
                                ...tour,
                                gameStats: { ...tour.gameStats, secondsLeft: remainingSecs }
                            };
                        }
                        return tour;
                    } else {
                        changed = true;
                        const currentItem = tour.blinds[tour.gameStats.currentStepIdx];
                        if (currentItem && currentItem.type === 'break') {
                            playSoundEffect(tour.soundsConfig.breakEnd || 'Chime Bell');
                        } else {
                            playSoundEffect(tour.soundsConfig.nextLevel || 'Boxing Bell');
                        }

                        const nextIdx = tour.gameStats.currentStepIdx + 1;
                        if (nextIdx < tour.blinds.length) {
                            const nextStep = tour.blinds[nextIdx];
                            const nextLengthSecs = (nextStep.length || 15) * 60;
                            return {
                                ...tour,
                                gameStats: {
                                    ...tour.gameStats,
                                    currentStepIdx: nextIdx,
                                    secondsLeft: nextLengthSecs,
                                    targetEndTime: now + (nextLengthSecs * 1000)
                                }
                            };
                        } else {
                            return {
                                ...tour,
                                gameStats: { ...tour.gameStats, secondsLeft: 0, targetEndTime: null, isPaused: true }
                            };
                        }
                    }
                });

                if (changed) {
                    return { ...prevState, tours: newTours, lastUpdated: Date.now() };
                }
                return prevState;
            });
        }, 300);
        return () => clearInterval(timer);
    }, []);

    const updateDraftConfig = (field, value) => {
        setDraftConfigState(prev => ({
            ...prev,
            config: { ...prev.config, [field]: value }
        }));
    };

    const updateDraftFontSize = (field, val) => {
        const numVal = val === '' ? '' : Number(val);
        setDraftConfigState(prev => ({
            ...prev,
            config: {
                ...prev.config,
                fontCustomSizes: {
                    ...(prev.config.fontCustomSizes || {}),
                    [field]: numVal
                }
            }
        }));
    };

    const handleFileUploadDraft = (e, configField) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 800;

                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.75);
                    updateDraftConfig(configField, compressedBase64);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    };

    const handleStatChange = (field, delta) => {
        setAppState(prev => {
            const nextState = {
                ...prev,
                tours: prev.tours.map(t => {
                    if (t.id === adminSetupTourId) {
                        return {
                            ...t,
                            gameStats: {
                                ...t.gameStats,
                                [field]: Math.max(0, (t.gameStats[field] || 0) + delta)
                            }
                        };
                    }
                    return t;
                }),
                lastUpdated: Date.now()
            };
            if (window.saveAppStateToCloud) {
                window.saveAppStateToCloud(nextState);
            }
            return nextState;
        });
    };

    const togglePauseTour = (tourId) => {
        const now = Date.now();
        setAppState(prev => {
            const nextState = {
                ...prev,
                tours: prev.tours.map(t => {
                    if (t.id === tourId) {
                        const willPause = !t.gameStats.isPaused;
                        if (willPause) {
                            return {
                                ...t,
                                gameStats: {
                                    ...t.gameStats,
                                    isPaused: true,
                                    targetEndTime: null
                                }
                            };
                        } else {
                            return {
                                ...t,
                                gameStats: {
                                    ...t.gameStats,
                                    isPaused: false,
                                    isFinished: false,
                                    targetEndTime: now + ((t.gameStats.secondsLeft || 900) * 1000)
                                }
                            };
                        }
                    }
                    return t;
                }),
                lastUpdated: Date.now()
            };
            if (window.saveAppStateToCloud) {
                window.saveAppStateToCloud(nextState);
            }
            return nextState;
        });
    };

    const finishTour = (tourId) => {
        if (window.confirm("Bạn có chắc chắn muốn KẾT THÚC Tour đấu này? Giao diện TV sẽ hiển thị vinh danh kết thúc.")) {
            setAppState(prev => {
                const nextState = {
                    ...prev,
                    tours: prev.tours.map(t => {
                        if (t.id === tourId) {
                            return {
                                ...t,
                                gameStats: {
                                    ...t.gameStats,
                                    isPaused: true,
                                    isFinished: true,
                                    targetEndTime: null
                                }
                            };
                        }
                        return t;
                    }),
                    lastUpdated: Date.now()
                };
                if (window.saveAppStateToCloud) {
                    window.saveAppStateToCloud(nextState);
                }
                return nextState;
            });
        }
    };

    const adjustTimerSeconds = (tourId, deltaSeconds) => {
        const now = Date.now();
        setAppState(prev => {
            const nextState = {
                ...prev,
                tours: prev.tours.map(t => {
                    if (t.id === tourId) {
                        const newSecs = Math.max(0, (t.gameStats.secondsLeft || 0) + deltaSeconds);
                        return {
                            ...t,
                            gameStats: {
                                ...t.gameStats,
                                secondsLeft: newSecs,
                                targetEndTime: t.gameStats.isPaused ? null : now + (newSecs * 1000)
                            }
                        };
                    }
                    return t;
                }),
                lastUpdated: Date.now()
            };
            if (window.saveAppStateToCloud) {
                window.saveAppStateToCloud(nextState);
            }
            return nextState;
        });
    };

    const addNewTournament = () => {
        const newId = Date.now();
        const newTour = defaultTourTemplate(`TOUR #${tournaments.length + 1}`, newId, 100, 100);
        newTour.gameStats.isPaused = true;
        newTour.gameStats.targetEndTime = null;

        setAppState(prev => {
            const nextState = {
                ...prev,
                tours: [...prev.tours, newTour],
                lastUpdated: Date.now()
            };
            if (window.saveAppStateToCloud) {
                window.saveAppStateToCloud(nextState);
            }
            return nextState;
        });
        setAdminSetupTourId(newId);
        setPublicViewTourId(newId);
    };

    const removeTournament = (tourId) => {
        if (tournaments.length <= 1) {
            alert("Cần duy trì ít nhất 1 giải đấu trong hệ thống!");
            return;
        }
        if (window.confirm("Xóa giải đấu này khỏi hệ thống?")) {
            const remaining = tournaments.filter(t => t.id !== tourId);
            setAppState(prev => {
                const nextState = {
                    ...prev,
                    tours: remaining,
                    lastUpdated: Date.now()
                };
                if (window.saveAppStateToCloud) {
                    window.saveAppStateToCloud(nextState);
                }
                return nextState;
            });
            setAdminSetupTourId(remaining[0].id);
            setPublicViewTourId(remaining[0].id);
        }
    };

    const saveCurrentTourAsPreset = () => {
        const presetName = prompt("Nhập tên để lưu mẫu Tour này (vd: Monster Stack 100k, High Roller 500k):", activeAdminTour.config.name);
        if (!presetName) return;

        const newPreset = {
            id: Date.now(),
            name: presetName,
            tourTemplate: JSON.parse(JSON.stringify(activeAdminTour))
        };

        setAppState(prev => {
            const nextState = {
                ...prev,
                presets: [...(prev.presets || []).filter(p => p.name !== presetName), newPreset],
                lastUpdated: Date.now()
            };
            if (window.saveAppStateToCloud) {
                window.saveAppStateToCloud(nextState);
            }
            return nextState;
        });
        alert(`Đã lưu mẫu tour "${presetName}" thành công!`);
    };

    const applyPresetToActiveTour = (presetObj) => {
        if (window.confirm(`Bạn có muốn nạp mẫu tour "${presetObj.name}" đè lên tour "${activeAdminTour.config.name}" hiện tại?`)) {
            const loaded = JSON.parse(JSON.stringify(presetObj.tourTemplate));
            loaded.id = adminSetupTourId;
            loaded.gameStats.isPaused = true;
            loaded.gameStats.targetEndTime = null;

            setAppState(prev => {
                const nextState = {
                    ...prev,
                    tours: prev.tours.map(t => t.id === adminSetupTourId ? loaded : t),
                    lastUpdated: Date.now()
                };
                if (window.saveAppStateToCloud) {
                    window.saveAppStateToCloud(nextState);
                }
                return nextState;
            });
        }
    };

    const deletePreset = (presetId, presetName) => {
        if (window.confirm(`Bạn có chắc chắn muốn XÓA mẫu tour "${presetName}" khỏi thư viện?`)) {
            setAppState(prev => {
                const nextState = {
                    ...prev,
                    presets: (prev.presets || []).filter(p => p.id !== presetId),
                    lastUpdated: Date.now()
                };
                if (window.saveAppStateToCloud) {
                    window.saveAppStateToCloud(nextState);
                }
                return nextState;
            });
        }

    const calculateNextProfessionalBlind = (currentBb) => {
        const standardSequence = [
            100, 200, 300, 400, 500, 600, 800,
            1000, 1200, 1500, 2000, 2500, 3000, 4000, 5000, 6000, 8000,
            10000, 12000, 15000, 20000, 25000, 30000, 40000, 50000, 60000, 80000,
            100000, 120000, 150000, 200000, 250000, 300000, 400000, 500000, 600000, 800000,
            1000000
        ];

        const matchIdx = standardSequence.findIndex(val => val > currentBb);
        let rawSb = 0;
        let nextBb = 0;

        if (matchIdx !== -1) {
            nextBb = standardSequence[matchIdx];
            rawSb = Math.round(nextBb / 2);
        } else {
            nextBb = Math.round((currentBb * 1.5) / 1000) * 1000;
            rawSb = Math.round(nextBb / 2);
        }

        let roundedSb = rawSb;
        if (rawSb >= 100 && rawSb % 100 !== 0) {
            roundedSb = Math.ceil(rawSb / 100) * 100;
        }

        return { sb: roundedSb, bb: nextBb, ante: nextBb };
    };

            const lastLevel = [...draftConfigState.blinds].reverse().find(b => b.type === 'level');
            if (lastLevel) {
                const nextBlinds = calculateNextProfessionalBlind(lastLevel.bb);

                    id: Date.now(),
                    type: 'level',
                    sb: nextBlinds.sb,
                    bb: nextBlinds.bb,
                    ante: nextBlinds.ante,

            ...prev,

    };

        newBlinds.splice(draggedBlindIdx, 1);

                                        <button onClick={() => adjustTimerSeconds(activeAdminTour.id, -60)} className="px-3 py-2 bg-gray-800 hover:bg-red-900/60 text-red-300 rounded-xl text-xs font-bold border border-red-700/40 cursor-pointer">-1m</button>
                                        <button onClick={() => adjustTimerSeconds(activeAdminTour.id, 60)} className="px-3 py-2 bg-gray-800 hover:bg-emerald-900/60 text-emerald-300 rounded-xl text-xs font-bold border border-emerald-700/40 cursor-pointer">+1m</button>
                                        <button onClick={() => adjustTimerSeconds(activeAdminTour.id, 300)} className="px-3 py-2 bg-gray-800 hover:bg-emerald-900/60 text-emerald-300 rounded-xl text-xs font-bold border border-emerald-700/40 cursor-pointer">+5m</button>
                                    </div>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                {[
                                    { label: 'Buy-ins / Players', field: 'buyIns' },
                                    { label: 'Eliminated', field: 'eliminated' },
                                    { label: 'Total Re-buys', field: 'rebuys' }
                                ].map(({ label, field }) => (
                                    <div key={field} className="bg-black/50 p-4 rounded-2xl border border-gray-800 text-center shadow-md">
                                        <div className="text-xs text-gray-400 uppercase font-bold mb-1.5">{label}</div>
                                        <div className="text-3xl font-black text-gold-bright my-1">{activeAdminTour.gameStats[field]}</div>
                                        <div className="flex justify-center space-x-3 mt-3">
                                            <button onClick={() => handleStatChange(field, -1)} className="w-10 h-10 bg-gray-800 hover:bg-gray-700 rounded-xl font-extrabold text-base text-white cursor-pointer shadow">-</button>
                                            <button onClick={() => handleStatChange(field, 1)} className="w-10 h-10 bg-amber-500 hover:bg-amber-400 rounded-xl font-extrabold text-base text-black cursor-pointer shadow">+</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                )}
            </main>

            <footer className="text-center py-3 text-xs text-gray-500 bg-black/80 hidden md:block border-t border-gray-900">
                Poker Tournament System &copy; 2026 Snap Call Club. All rights reserved.
            </footer>
        </div>
    );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
